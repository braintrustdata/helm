{{- if .Values.aiGateway.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "braintrust.aiGateway.serviceAccountName" . }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.aiGateway.labels)) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.aiGateway.annotations.serviceaccount }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
