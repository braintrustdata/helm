{{- $virtualServiceWorkloadIsolation := .Values.virtualService.workloadIsolation | default dict -}}
{{- if and $virtualServiceWorkloadIsolation.enabled (not .Values.virtualService.enabled) -}}
{{- fail "virtualService.workloadIsolation.enabled requires virtualService.enabled." -}}
{{- end -}}
{{- if and $virtualServiceWorkloadIsolation.enabled (not .Values.api.workloadIsolation.enabled) -}}
{{- fail "virtualService.workloadIsolation.enabled requires api.workloadIsolation.enabled." -}}
{{- end -}}
{{- include "braintrust.loopRuntime.validate" . -}}
{{- if .Values.virtualService.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Values.virtualService.name | default (printf "%s-vs" .Values.api.name) }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (merge .Values.global.labels .Values.virtualService.labels) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.virtualService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.virtualService.gateways }}
  gateways:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.virtualService.hosts }}
  hosts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  http:
    {{- if .Values.loopRuntime.enabled }}
    {{- include "braintrust.loopRuntimeVirtualServiceRoutes" . | nindent 4 }}
    {{- end }}
    {{- if $virtualServiceWorkloadIsolation.enabled }}
    {{- include "braintrust.apiWorkloadIsolationVirtualServiceRoutes" . | nindent 4 }}
    {{- end }}
    {{- range .Values.virtualService.http }}
    - {{ toYaml . | nindent 6 | trim }}
    {{- end }}
{{- end }}
