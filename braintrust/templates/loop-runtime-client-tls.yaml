{{- include "braintrust.loopRuntime.validate" . -}}
{{- if include "braintrust.loopRuntime.enabled" . -}}
{{- with .Values.loopRuntime.sandbox.clientTls }}
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-client-tls
  namespace: {{ include "braintrust.namespace" $ }}
  {{- with (mergeOverwrite (deepCopy $.Values.global.labels) (deepCopy $.Values.loopRuntime.labels)) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  client.pem: {{ index . "client.pem" | b64enc | quote }}
  client.key: {{ index . "client.key" | b64enc | quote }}
  server-ca.pem: {{ index . "server-ca.pem" | b64enc | quote }}
{{- end }}
{{- end }}
