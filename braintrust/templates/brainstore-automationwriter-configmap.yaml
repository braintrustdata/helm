{{/*
Omit this ConfigMap when brainstore.automationwriter is absent. helm upgrade
--reuse-values from a chart that predates the pool does not merge the new
default map, and absence means the pool stays disabled.
*/}}
{{- if .Values.brainstore.automationwriter }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.brainstore.automationwriter.name }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (merge (deepCopy .Values.brainstore.automationwriter.labels) .Values.global.labels) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.brainstore.automationwriter.annotations.configmap }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  BRAINSTORE_READER_ONLY_MODE: "false"
  BRAINSTORE_VERBOSE: {{ (or (eq (toString .Values.brainstore.automationwriter.verbose) "true") (eq (toString .Values.brainstore.automationwriter.verbose) "1")) | ternary "1" "0" | quote }}
  BRAINSTORE_PORT: {{ .Values.brainstore.automationwriter.port | quote }}
  BRAINSTORE_CACHE_DIR: {{ .Values.brainstore.automationwriter.cacheDir | quote }}
  BRAINSTORE_OBJECT_STORE_CACHE_MEMORY_LIMIT: {{ .Values.brainstore.automationwriter.objectStoreCacheMemoryLimit | quote }}
  BRAINSTORE_OBJECT_STORE_CACHE_FILE_SIZE: {{ .Values.brainstore.automationwriter.objectStoreCacheFileSize | quote }}
  {{- if eq .Values.cloud "azure" }}
  # See here for reference:
  # https://docs.rs/object_store/latest/object_store/azure/struct.MicrosoftAzureBuilder.html
  AZURE_STORAGE_ACCOUNT_NAME: {{ .Values.objectStorage.azure.storageAccountName | quote }}
  # This will create odd paths like az://brainstore/brainstore/index, but it maintains the naming and prefix conventions
  # with AWS and avoids confusion with env vars.
  BRAINSTORE_INDEX_URI: "az://{{ .Values.objectStorage.azure.brainstoreContainer }}/brainstore/index"
  BRAINSTORE_REALTIME_WAL_URI: "az://{{ .Values.objectStorage.azure.brainstoreContainer }}/brainstore/wal"
  {{- if eq .Values.brainstore.locksBackend "objectStorage" }}
  BRAINSTORE_LOCKS_URI: "az://{{ .Values.objectStorage.azure.brainstoreContainer }}/brainstore/locks"
  {{- end }}
  {{- if .Values.objectStorage.azure.responseContainer }}
  BRAINSTORE_RESPONSE_CACHE_URI: "az://{{ .Values.objectStorage.azure.responseContainer }}/brainstore-cache"
  {{- end }}
  {{- if .Values.objectStorage.azure.codeBundleContainer }}
  BRAINSTORE_CODE_BUNDLE_URI: "az://{{ .Values.objectStorage.azure.codeBundleContainer }}"
  {{- end }}
  {{- else if eq .Values.cloud "aws" }}
  BRAINSTORE_INDEX_URI: "s3://{{ .Values.objectStorage.aws.brainstoreBucket }}/brainstore/index"
  BRAINSTORE_REALTIME_WAL_URI: "s3://{{ .Values.objectStorage.aws.brainstoreBucket }}/brainstore/wal"
  {{- if eq .Values.brainstore.locksBackend "objectStorage" }}
  BRAINSTORE_LOCKS_URI: "s3://{{ .Values.objectStorage.aws.brainstoreBucket }}/brainstore/locks"
  {{- end }}
  {{- if .Values.objectStorage.aws.responseBucket }}
  BRAINSTORE_RESPONSE_CACHE_URI: "s3://{{ .Values.objectStorage.aws.responseBucket }}/brainstore-cache"
  {{- end }}
  {{- if .Values.objectStorage.aws.codeBundleBucket }}
  BRAINSTORE_CODE_BUNDLE_URI: "s3://{{ .Values.objectStorage.aws.codeBundleBucket }}"
  {{- end }}
  {{- else if eq .Values.cloud "google" }}
  BRAINSTORE_INDEX_URI: "gs://{{ .Values.objectStorage.google.brainstoreBucket }}/brainstore/index"
  BRAINSTORE_REALTIME_WAL_URI: "gs://{{ .Values.objectStorage.google.brainstoreBucket }}/brainstore/wal"
  {{- if eq .Values.brainstore.locksBackend "objectStorage" }}
  BRAINSTORE_LOCKS_URI: "gs://{{ .Values.objectStorage.google.brainstoreBucket }}/brainstore/locks"
  {{- end }}
  {{- if .Values.objectStorage.google.apiBucket }}
  BRAINSTORE_RESPONSE_CACHE_URI: "gs://{{ .Values.objectStorage.google.apiBucket }}/brainstore-cache"
  BRAINSTORE_CODE_BUNDLE_URI: "gs://{{ .Values.objectStorage.google.apiBucket }}"
  {{- end }}
  {{- end }}
  BRAINSTORE_CONTROL_PLANE_TELEMETRY: {{ .Values.global.controlPlaneTelemetry | quote }}
  NO_COLOR: "1"
  {{- if .Values.skipPgForBrainstoreObjects }}
  BRAINSTORE_ASYNC_SCORING_OBJECTS: {{ .Values.skipPgForBrainstoreObjects | quote }}
  BRAINSTORE_LOG_AUTOMATIONS_OBJECTS: {{ .Values.skipPgForBrainstoreObjects | quote }}
  {{- end }}
  # Dedicated automation writer pool: run only the automations writer loop.
  # The regular writer pool is configured to exclude automations whenever this
  # pool is enabled (see brainstore-writer-configmap.yaml).
  BRAINSTORE_WRITER_LOOP_CONFIG: "include:automations"
{{- end }}