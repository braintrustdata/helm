{{- $autoscaling := .Values.aiGateway.autoscaling | default dict }}
{{- if and .Values.aiGateway.enabled (dig "enabled" true $autoscaling) }}
{{- $minReplicas := int (dig "minReplicas" 2 $autoscaling) }}
{{- $maxReplicas := int (dig "maxReplicas" 6 $autoscaling) }}
{{- $cpuTarget := int (dig "cpu" "targetAverageUtilization" 70 $autoscaling) }}
{{- $memoryTarget := int (dig "memory" "targetAverageUtilization" 75 $autoscaling) }}
{{- $requests := (.Values.aiGateway.resources | default dict).requests | default dict }}
{{- if not (and (ge $minReplicas 1) (ge $maxReplicas $minReplicas) (gt $cpuTarget 0) (gt $memoryTarget 0) $requests.cpu $requests.memory) }}
{{- fail "aiGateway.autoscaling needs 1 <= minReplicas <= maxReplicas, positive CPU and memory targets, and aiGateway.resources.requests for CPU and memory" }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.aiGateway.name }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (merge (deepCopy .Values.aiGateway.labels) .Values.global.labels) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.aiGateway.name }}
  minReplicas: {{ $minReplicas }}
  maxReplicas: {{ $maxReplicas }}
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: ai-gateway
        target:
          type: Utilization
          averageUtilization: {{ $cpuTarget }}
    - type: ContainerResource
      containerResource:
        name: memory
        container: ai-gateway
        target:
          type: Utilization
          averageUtilization: {{ $memoryTarget }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
