{{- if .Values.aiGateway.enabled }}
{{- $autoscaling := include "braintrust.aiGateway.autoscaling" . | fromYaml }}
{{- if $autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.aiGateway.name }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (merge (deepCopy .Values.aiGateway.labels) .Values.global.labels) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with (dig "hpa" dict (.Values.aiGateway.annotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.aiGateway.name }}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    # ContainerResource scopes utilization to the ai-gateway container so
    # sidecars / extraContainers do not skew it.
    - type: ContainerResource
      containerResource:
        name: cpu
        container: ai-gateway
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.cpu.targetAverageUtilization }}
    - type: ContainerResource
      containerResource:
        name: memory
        container: ai-gateway
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.memory.targetAverageUtilization }}
  {{- with $autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
