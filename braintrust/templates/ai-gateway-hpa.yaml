{{- $autoscaling := .Values.aiGateway.autoscaling | default dict }}
{{- if and .Values.aiGateway.enabled (dig "enabled" true $autoscaling) }}
{{- $minReplicas := dig "minReplicas" 2 $autoscaling }}
{{- if lt (int $minReplicas) 1 }}
{{- fail "aiGateway.autoscaling.minReplicas must be at least 1" }}
{{- end }}
{{- $requests := (.Values.aiGateway.resources | default dict).requests | default dict }}
{{- if not (and $requests.cpu $requests.memory) }}
{{- fail "aiGateway.autoscaling needs aiGateway.resources.requests.cpu and .memory. Set them, or set aiGateway.autoscaling.enabled to false." }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.aiGateway.name }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (merge (deepCopy .Values.aiGateway.labels) .Values.global.labels) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.aiGateway.name }}
  minReplicas: {{ $minReplicas }}
  maxReplicas: {{ dig "maxReplicas" 6 $autoscaling }}
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: ai-gateway
        target:
          type: Utilization
          averageUtilization: {{ dig "cpu" "targetAverageUtilization" 70 $autoscaling }}
    - type: ContainerResource
      containerResource:
        name: memory
        container: ai-gateway
        target:
          type: Utilization
          averageUtilization: {{ dig "memory" "targetAverageUtilization" 75 $autoscaling }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
