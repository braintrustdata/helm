{{- $config := include "braintrust.deploymentOrdering.config" . | fromYaml -}}
{{- if $config.enabled -}}
{{- $name := include "braintrust.migrations.name" . -}}
{{- $hook := printf "%s-reset" $name -}}
{{/* Hook manifests belong to the target release, so the name is the original
revision's name, not the new rollback revision. No hook runs during install or
upgrade. Helm executes these by weight, then deletes successful hooks in reverse. */}}
{{- range $kind := list "ServiceAccount" "Role" "RoleBinding" }}
---
apiVersion: {{ ternary "v1" "rbac.authorization.k8s.io/v1" (eq $kind "ServiceAccount") }}
kind: {{ $kind }}
metadata:
  name: {{ $hook }}
  namespace: {{ include "braintrust.namespace" $ }}
  annotations:
    helm.sh/hook: pre-rollback
    helm.sh/hook-weight: {{ index (dict "ServiceAccount" "-3" "Role" "-2" "RoleBinding" "-1") $kind | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
{{- if eq $kind "Role" }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-config" $name | quote }}, {{ printf "%s-gate" $name | quote }}]
    verbs: ["get", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "delete"]
{{- else if eq $kind "RoleBinding" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $hook }}
subjects:
  - kind: ServiceAccount
    name: {{ $hook }}
    namespace: {{ include "braintrust.namespace" $ }}
{{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hook }}
  namespace: {{ include "braintrust.namespace" . }}
  annotations:
    helm.sh/hook: pre-rollback
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $config.backoffLimit }}
  activeDeadlineSeconds: {{ $config.timeoutSeconds }}
  template:
    spec:
      serviceAccountName: {{ $hook }}
      restartPolicy: Never
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cleanup
          image: {{ $config.image | quote }}
          command:
            - python3
            - -B
            - -u
            - -c
            - |
              {{- .Files.Get "files/migration-rollback.py" | nindent 14 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JOB_NAME
              value: {{ $name | quote }}
            - name: JOB_TIMEOUT_SECONDS
              value: {{ $config.timeoutSeconds | quote }}
{{- end }}
