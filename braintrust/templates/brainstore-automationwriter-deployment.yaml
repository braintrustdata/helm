{{/*
Omit this Deployment when brainstore.automationwriter is absent. helm upgrade
--reuse-values from a chart that predates the pool does not merge the new
default map, and absence means the pool stays disabled.
*/}}
{{- if .Values.brainstore.automationwriter }}
{{- $rollout := include "braintrust.deploymentRollout.config" (dict "config" .Values.brainstore.automationwriter) | fromYaml -}}
{{- include "braintrust.deploymentRollout.validate" (dict "path" "brainstore.automationwriter" "config" $rollout) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.brainstore.automationwriter.name }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (merge (deepCopy .Values.brainstore.automationwriter.labels) .Values.global.labels) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.brainstore.automationwriter.annotations.deployment }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.brainstore.automationwriter.replicas }}
  minReadySeconds: {{ $rollout.minReadySeconds }}
  progressDeadlineSeconds: {{ $rollout.progressDeadlineSeconds }}
  strategy:
    type: {{ $rollout.strategy.type }}
    {{- if eq $rollout.strategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml $rollout.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.brainstore.automationwriter.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.brainstore.automationwriter.name }}
        {{- if eq .Values.cloud "azure" }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- if eq .Values.cloud "google" }}
        gke-workload-identity/use: "true"
        {{- end }}
        {{- with (merge (deepCopy .Values.brainstore.automationwriter.podLabels) .Values.brainstore.automationwriter.labels .Values.global.labels) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/brainstore-automationwriter-configmap.yaml") . | sha256sum }}
        {{- if eq .Values.cloud "google" }}
        iam.gke.io/gcp-service-account: {{ required "brainstore.serviceAccount.googleServiceAccount is required when cloud is google" .Values.brainstore.serviceAccount.googleServiceAccount }}
        {{- end }}
        {{- with .Values.brainstore.automationwriter.annotations.pod }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.brainstore.serviceAccount.name }}
      {{- with .Values.brainstore.automationwriter.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.brainstore.automationwriter.nodeSelector (and (eq .Values.cloud "google") (eq .Values.google.mode "autopilot")) }}
      nodeSelector:
        {{- with .Values.brainstore.automationwriter.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and (eq .Values.cloud "google") (eq .Values.google.mode "autopilot") }}
        cloud.google.com/machine-family: {{ .Values.google.autopilotMachineFamily | default "c4" }}
        cloud.google.com/gke-ephemeral-storage-local-ssd: "true"
        cloud.google.com/compute-class: "Performance"
        {{- end }}
      {{- end }}
      {{- with .Values.brainstore.automationwriter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.brainstore.automationwriter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: brainstore-automationwriter
          image: "{{ .Values.brainstore.image.repository }}:{{ .Values.brainstore.image.tag }}"
          imagePullPolicy: {{ .Values.brainstore.image.pullPolicy }}
          {{- with .Values.brainstore.automationwriter.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["brainstore"]
          args: ["web"]
          ports:
            - containerPort: {{ .Values.brainstore.automationwriter.port }}
          resources:
            {{- include "braintrust.brainstoreResources" (dict
              "root" .
              "resources" .Values.brainstore.automationwriter.resources
              "volumeSize" .Values.brainstore.automationwriter.volume.size
              "ephemeralStorage" .Values.brainstore.automationwriter.ephemeralStorage
            ) | nindent 12 }}
          {{- with .Values.brainstore.livenessProbe }}
          livenessProbe:
            {{- $probe := deepCopy . }}
            {{- if $probe.httpGet }}
            {{- $_ := set $probe.httpGet "port" $.Values.brainstore.automationwriter.port }}
            {{- end }}
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with .Values.brainstore.readinessProbe }}
          readinessProbe:
            {{- $probe := deepCopy . }}
            {{- if $probe.httpGet }}
            {{- $_ := set $probe.httpGet "port" $.Values.brainstore.automationwriter.port }}
            {{- end }}
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.brainstore.automationwriter.name }}
          env:
            - name: BRAINSTORE_METADATA_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: PG_URL
            - name: BRAINSTORE_WAL_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: PG_URL
            - name: BRAINSTORE_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: REDIS_URL
            - name: BRAINSTORE_XACT_MANAGER_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: REDIS_URL
            - name: BRAINSTORE_AI_PROXY_URL
              value: {{ include "braintrust.apiAiProxyInternalUrl" . | quote }}
            {{- if eq .Values.brainstore.locksBackend "redis" }}
            - name: BRAINSTORE_LOCKS_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: REDIS_URL
            {{- end }}
            - name: BRAINSTORE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: BRAINSTORE_LICENSE_KEY
            - name: FUNCTION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: FUNCTION_SECRET_KEY
            {{- if .Values.brainstore.automationwriter.extraEnvVars }}
            {{- toYaml .Values.brainstore.automationwriter.extraEnvVars | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: cache-volume
              mountPath: {{ .Values.brainstore.automationwriter.cacheDir }}
            {{- if .Values.brainstore.automationwriter.tmpVolume.enabled }}
            - name: tmp-volume
              mountPath: /tmp
            {{- end }}
            {{- if and (eq .Values.cloud "azure") .Values.azure.enableAzureKeyVaultDriver }}
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            {{- end }}
      {{- with .Values.brainstore.automationwriter.extraContainers }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: cache-volume
          {{- /* Azure local disk is required only once this pool has replicas. A disabled pool must render without a size. */}}
          {{- if and (eq .Values.cloud "azure") .Values.azure.enableAzureContainerStorageDriver (gt (int (.Values.brainstore.automationwriter.replicas | default 0)) 0) }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                volumeMode: Filesystem
                accessModes: ["ReadWriteOnce"]
                storageClassName: local
                resources:
                  requests:
                    storage: {{ required "brainstore.automationwriter.volume.size must be set" (dig "volume" "size" "" .Values.brainstore.automationwriter) | quote }}
          {{- else }}
          emptyDir:
            {{- if .Values.brainstore.automationwriter.volume.sizeLimit }}
            sizeLimit: {{ .Values.brainstore.automationwriter.volume.sizeLimit | quote }}
            {{- else }}
            {}
            {{- end }}
          {{- end }}
        {{- if .Values.brainstore.automationwriter.tmpVolume.enabled }}
        - name: tmp-volume
          emptyDir:
            {{- if .Values.brainstore.automationwriter.tmpVolume.sizeLimit }}
            sizeLimit: {{ .Values.brainstore.automationwriter.tmpVolume.sizeLimit | quote }}
            {{- else }}
            {}
            {{- end }}
        {{- end }}
        {{- if and (eq .Values.cloud "azure") .Values.azure.enableAzureKeyVaultDriver }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.azure.keyVaultName }}
        {{- end }}
        {{- with .Values.brainstore.automationwriter.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
