{{- $gate := include "braintrust.brainstoreStartupGate.config" . | fromYaml -}}
{{- if $gate.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "braintrust.brainstoreStartupGate.name" . }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.api.labels)) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      {{- range (include "braintrust.brainstoreStartupGate.targets" . | fromJsonArray) }}
      - {{ .deployment | quote }}
      {{- end }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "braintrust.brainstoreStartupGate.name" . }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.api.labels)) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "braintrust.brainstoreStartupGate.name" . }}
subjects:
  {{- $accounts := dict -}}
  {{- range $pool := include "braintrust.apiPools" . | fromYamlArray -}}
  {{- $_ := set $accounts $pool.config.serviceAccount.name true -}}
  {{- end -}}
  {{- range $name := keys $accounts | sortAlpha }}
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "braintrust.namespace" $ }}
  {{- end }}
{{- end }}
