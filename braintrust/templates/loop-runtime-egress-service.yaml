{{- include "braintrust.loopRuntime.validate" . -}}
{{- if include "braintrust.loopRuntime.enabled" . -}}
{{- $egressGateway := .Values.loopRuntime.sandbox.egressGateway -}}
# Workers in the isolated cluster reach the Git forward proxy through this
# internal load balancer, on the address Terraform reserves.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.loopRuntime.service.name | default .Values.loopRuntime.name }}-egress
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.loopRuntime.labels)) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  loadBalancerIP: {{ $egressGateway.address | quote }}
  loadBalancerSourceRanges:
    {{- toYaml $egressGateway.sourceRanges | nindent 4 }}
  selector:
    app: {{ .Values.loopRuntime.name }}
  ports:
    - name: egress
      port: 4002
      targetPort: 4002
{{- end }}
