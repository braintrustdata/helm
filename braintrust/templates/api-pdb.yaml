{{- $root := . -}}
{{- $pools := include "braintrust.apiPools" . | fromYamlArray -}}
{{- $rendered := 0 -}}
{{- range $pool := $pools -}}
{{- $api := $pool.config -}}
{{- $pdb := $api.podDisruptionBudget | default dict -}}
{{- if $pdb.enabled }}
{{- if gt $rendered 0 }}
---
{{- end }}
{{ $resourceLabels := mergeOverwrite (deepCopy $root.Values.global.labels) (deepCopy $api.labels) (dict "braintrust.dev/api-pool" $pool.role) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $api.name }}
  namespace: {{ include "braintrust.namespace" $root }}
  {{- with $resourceLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if ne $pdb.maxUnavailable nil }}
  maxUnavailable: {{ $pdb.maxUnavailable | toYaml | trim }}
  {{- else }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $api.name }}
{{- $rendered = add1 $rendered -}}
{{- end }}
{{- end }}
