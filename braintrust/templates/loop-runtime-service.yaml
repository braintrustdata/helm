{{- include "braintrust.loopRuntime.validate" . -}}
{{- if .Values.loopRuntime.enabled -}}
{{- $resourceLabels := mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.loopRuntime.labels) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.loopRuntime.service.name | default .Values.loopRuntime.name }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with $resourceLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.loopRuntime.annotations.service }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app: {{ .Values.loopRuntime.name }}
  ports:
    - name: {{ .Values.loopRuntime.service.portName }}
      protocol: TCP
      port: {{ .Values.loopRuntime.service.port }}
      targetPort: {{ .Values.loopRuntime.service.port }}
  type: {{ .Values.loopRuntime.service.type }}
{{- end }}
