{{- if include "braintrust.rollout.enabled" . -}}
{{- $migration := include "braintrust.migrations.config" . | fromYaml -}}
{{- $gate := include "braintrust.brainstoreStartupGate.config" . | fromYaml -}}
{{- $name := include "braintrust.rollout.name" . -}}
{{- $account := include "braintrust.rollout.serviceAccount" . -}}
{{- $targets := include "braintrust.rollout.targets" . | fromJsonArray -}}
{{- $labels := mergeOverwrite (deepCopy .Values.global.labels) (dict "braintrust.dev/migration-release" .Release.Name) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ include "braintrust.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  backoffLimit: {{ $migration.backoffLimit }}
  activeDeadlineSeconds: {{ add (int $migration.timeoutSeconds) (int $gate.timeoutSeconds) }}
  template:
    metadata:
      labels:
        {{- mergeOverwrite (deepCopy $labels) (dict "app" $name) | toYaml | nindent 8 }}
    spec:
      serviceAccountName: {{ $account }}
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "braintrust.releaseJob.initContainer" (dict "root" .) | nindent 8 }}
      containers:
        - name: wait-for-rollout
          image: {{ $gate.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python3", "-B", "-u", "/opt/migration-gate/brainstore_rollout.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml $gate.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ROLLOUT_TIMEOUT_SECONDS
              value: {{ $gate.timeoutSeconds | quote }}
            - name: ROLLOUT_POLL_SECONDS
              value: {{ $gate.pollIntervalSeconds | quote }}
          volumeMounts:
            - name: migration-gate-code
              mountPath: /opt/migration-gate
              readOnly: true
            - name: migration-gate-credentials
              mountPath: /var/run/migration-gate
              readOnly: true
      volumes:
        {{- include "braintrust.releaseJob.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ include "braintrust.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- toYaml $labels | nindent 4 }}
data:
  ROLLOUT_TARGETS: {{ toJson $targets | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ include "braintrust.namespace" . }}
  labels:
    {{- toYaml $labels | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "braintrust.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- toYaml $labels | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      {{- range $target := $targets }}
      - {{ $target.deployment | quote }}
      {{- end }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "braintrust.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- toYaml $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ include "braintrust.namespace" . }}
{{- end }}
