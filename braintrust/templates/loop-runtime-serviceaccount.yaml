{{- include "braintrust.loopRuntime.validate" . -}}
{{- if include "braintrust.loopRuntime.enabled" . -}}
{{- $labels := mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.loopRuntime.labels) -}}
{{- $annotations := mergeOverwrite (deepCopy .Values.loopRuntime.annotations.serviceaccount) (deepCopy .Values.loopRuntime.serviceAccount.annotations) -}}
{{- $_ := set $annotations "iam.gke.io/gcp-service-account" .Values.loopRuntime.serviceAccount.googleServiceAccount -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.loopRuntime.serviceAccount.name }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with $labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
