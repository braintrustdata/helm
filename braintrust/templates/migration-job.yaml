{{- $config := include "braintrust.deploymentOrdering.config" . | fromYaml -}}
{{- if $config.enabled -}}
{{- $name := include "braintrust.migrations.name" . -}}
{{/* Reuse exactly the execution contract used to content-address this Job. */}}
{{- $execution := include "braintrust.migrations.execution" (dict "root" . "name" $name) | fromYaml -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ include "braintrust.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.api.labels) (dict "braintrust.dev/migration-release" .Release.Name) | toYaml | nindent 4 }}
spec:
  {{- toYaml $execution.settings | nindent 2 }}
  template:
    {{- toYaml $execution.pod | nindent 4 }}
---
{{/* Successful content-addressed Jobs and their configuration snapshots are
reused across upgrades and rollbacks. Secrets remain Secret references. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ include "braintrust.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    braintrust.dev/migration-release: {{ .Release.Name | quote }}
immutable: true
data:
  {{- toYaml $execution.apiConfig | nindent 2 }}
{{- end }}
