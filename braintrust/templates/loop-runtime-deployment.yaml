{{- include "braintrust.loopRuntime.validate" . -}}
{{- if include "braintrust.loopRuntime.enabled" . -}}
{{- $podLabels := mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.loopRuntime.labels) (deepCopy .Values.loopRuntime.podLabels) (dict "app" .Values.loopRuntime.name "gke-workload-identity/use" "true") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.loopRuntime.name }}
  namespace: {{ include "braintrust.namespace" . }}
  {{- with (mergeOverwrite (deepCopy .Values.global.labels) (deepCopy .Values.loopRuntime.labels)) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.loopRuntime.annotations.deployment }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ ternary 1 .Values.loopRuntime.replicas (has .Values.loopRuntime.replicas (list nil "")) }}
  selector:
    matchLabels:
      app: {{ .Values.loopRuntime.name }}
  template:
    metadata:
      labels:
        {{- toYaml $podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/loop-runtime-configmap.yaml") . | sha256sum }}
        iam.gke.io/gcp-service-account: {{ .Values.loopRuntime.serviceAccount.googleServiceAccount }}
        {{- with .Values.loopRuntime.annotations.pod }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.loopRuntime.serviceAccount.name }}
      # The runtime drains active turns for up to 90 seconds after SIGTERM.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.loopRuntime.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loopRuntime.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loopRuntime.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: loop-runtime
          image: "{{ .Values.loopRuntime.image.repository }}:{{ .Values.loopRuntime.image.tag }}"
          imagePullPolicy: {{ .Values.loopRuntime.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: {{ .Values.loopRuntime.service.portName }}
              containerPort: {{ .Values.loopRuntime.service.port }}
            # Git forward proxy for sandboxes.
            - containerPort: 4002
          resources:
            {{- toYaml .Values.loopRuntime.resources | nindent 12 }}
          {{- range $name := list "livenessProbe" "readinessProbe" }}
          {{- with index $.Values.loopRuntime $name }}
          {{- $probe := deepCopy . -}}
          {{- if and (kindIs "map" $probe.httpGet) (not (hasKey $probe.httpGet "port")) -}}
          {{- $_ := set $probe.httpGet "port" $.Values.loopRuntime.service.port -}}
          {{- end }}
          {{ $name }}:
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.loopRuntime.name }}
          env:
            - name: BRAINSTORE_METADATA_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: PG_URL
            - name: BRAINSTORE_WAL_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: PG_URL
            - name: BRAINSTORE_XACT_MANAGER_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: REDIS_URL
            - name: BRAINSTORE_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: REDIS_URL
            - name: SERVICE_TOKEN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: FUNCTION_SECRET_KEY
            - name: FUNCTION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: FUNCTION_SECRET_KEY
            - name: BRAINSTORE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: BRAINSTORE_LICENSE_KEY
            {{- if eq .Values.brainstore.locksBackend "redis" }}
            - name: BRAINSTORE_LOCKS_URI
              valueFrom:
                secretKeyRef:
                  name: braintrust-secrets
                  key: REDIS_URL
            {{- end }}
            {{- with .Values.loopRuntime.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: state
              mountPath: /mnt/tmp/loop-runtime
            - name: cache
              mountPath: /mnt/tmp/brainstore
            - name: sandbox-tls
              mountPath: /etc/sandbox-tls
              readOnly: true
      {{- with .Values.loopRuntime.extraContainers }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: state
          emptyDir:
            sizeLimit: 2Gi
        - name: cache
          emptyDir:
            sizeLimit: 6Gi
        # Created by examples/gke-loop-runtime/create-sandbox-tls.sh.
        - name: sandbox-tls
          secret:
            secretName: sandbox-client-tls
        {{- with .Values.loopRuntime.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
