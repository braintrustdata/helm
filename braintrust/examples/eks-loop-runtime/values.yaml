# Layer on top of the existing AWS infrastructure values for this chart.
cloud: aws

loopRuntime:
  enabled: true
  image:
    tag: v2.18.0
  nodeSelector:
    braintrust.io/workload: sandbox-system
  sandbox:
    dnsUrl: https://sandbox-service.braintrust-sandbox.svc.cluster.local:9400
    tls:
      secretName: sandbox-client-tls
    egressGateway:
      enabled: true
      # Uses the in-cluster egress Service; no additional load balancer is needed.
      url: ""
