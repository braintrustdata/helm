# GKE Autopilot is preferred for new deployments.
# Use this supported Standard example when customer requirements prevent Autopilot use.
# Sample values for GKE Standard deployment
#
# Terraform creates the services and brainstore node pools.
# Brainstore requires a bundled Local SSD machine type, such as c4a-standard-48-lssd.
# GKE selects the fixed SSD count from the machine type.
# Enable PDB protection on existing pools before a hardware replacement.
# Deploy these PDBs before that replacement.

# Global configs
global:
  orgName: "<your Braintrust org name>"
  namespace: "braintrust"

# Cloud provider configuration
cloud: "google" 

# Google Cloud specific configuration for Standard
google:
  mode: "standard"

objectStorage:
  google:
    brainstoreBucket: "<your brainstore bucket name>"
    apiBucket: "<your api bucket name>"

api:
  name: "braintrust-api"
  annotations:
    service:
      networking.gke.io/load-balancer-type: "Internal"
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  replicas: 4
  # Uncomment the following section to use a different image or tag from the version in the Helm release
  #image:
    #repository: public.ecr.aws/braintrust/standalone-api
    #tag: "<your image tag>"
  service:
    type: LoadBalancer
    port: 8000
    portName: http
  serviceAccount:
   name: "braintrust-api"
   googleServiceAccount: "<your Braintrust API Google service account>"
  # Native GCS authentication via Workload Identity. Set to true to use GCS natively instead of S3-compatible access.
  enableGcsAuth: false
  nodeSelector:
    braintrust/node-pool: "services"
  resources:
    requests:
      cpu: "4"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  extraEnvVars:
    # For S3-compatible GCS Storage, set the AWS_REGION environment variable to the region of your GCS bucket
    - name: AWS_REGION
      value: "us-central1"

aiGateway:
  nodeSelector:
    braintrust/node-pool: "services"

# Brainstore configuration (split into reader and writer)
brainstore:
  serviceAccount:
    name: "brainstore"
    googleServiceAccount: "<your Braintrust Brainstore Google service account>"
  # Uncomment the following section to use a different image or tag from the version in the Helm release
  #image:
    #repository: public.ecr.aws/braintrust/brainstore
    #tag: "<your image tag>"
  # New deployments should use objectStorage as the locks backend. Existing deployments should remain on redis at this time. 
  locksBackend: "objectStorage"

  # Brainstore Reader configuration
  reader:
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    name: "brainstore-reader"
    replicas: 2
    service:
      name: ""
      type: ClusterIP
      port: 4000
      portName: http
    nodeSelector:
         braintrust/node-pool: "brainstore"
    resources:
      requests:
        cpu: "16"
        memory: "32Gi"
      limits:
        cpu: "16"
        memory: "32Gi"
    affinity:     # Prevent readers and writers from sharing nodes
         podAntiAffinity:
           requiredDuringSchedulingIgnoredDuringExecution:
             - labelSelector:
                 matchExpressions:
                   - key: app
                     operator: In
                     values:
                       - brainstore-reader
                       - brainstore-writer
               topologyKey: kubernetes.io/hostname
    cacheDir: "/mnt/tmp/brainstore"
    objectStoreCacheMemoryLimit: "1Gi"
    objectStoreCacheFileSize: "1000Gi"
    verbose: true
    volume:
      size: "200Gi"
    extraEnvVars:

  # Brainstore Fast Reader configuration
  fastreader:
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    nodeSelector:
      braintrust/node-pool: "brainstore"

  # Brainstore Writer configuration
  # One writer can stop briefly during a node drain.
  writer:
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    name: "brainstore-writer"
    replicas: 1
    service:
      name: ""
      type: ClusterIP
      port: 4000
      portName: http
    nodeSelector:
         braintrust/node-pool: "brainstore"
    resources:
      requests:
        cpu: "32"
        memory: "64Gi"
      limits:
        cpu: "32"
        memory: "64Gi"
    affinity:     # Prevent readers and writers from sharing nodes
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - brainstore-reader
                    - brainstore-writer
            topologyKey: kubernetes.io/hostname    
    cacheDir: "/mnt/tmp/brainstore"
    objectStoreCacheMemoryLimit: "1Gi"
    objectStoreCacheFileSize: "1000Gi"
    verbose: true
    volume:
      size: "200Gi"  
    extraEnvVars:
