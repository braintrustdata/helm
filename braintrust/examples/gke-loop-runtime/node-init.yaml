# GKE node pools have no bootstrap hook, so this DaemonSet does what EKS node
# bootstrap does for the Sandbox Service worker chart: mount XFS at the worker's
# state path, create /run/netns, and check /dev/kvm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-node-init
  namespace: braintrust-sandbox
data:
  init.sh: |
    #!/bin/bash
    # The worker entrypoint refuses to start unless /state is an XFS filesystem
    # root. This also keeps it off the boot disk while initialization runs.
    set -euo pipefail
    ROOT="${ROOT:-/var/lib/braintrust-sandboxes/1}"
    DEVICES="${DEVICES:-/dev/disk/by-id/google-local-nvme-ssd-*}"
    mkdir -p /run/netns
    modprobe kvm_intel 2>/dev/null || modprobe kvm_amd 2>/dev/null || true
    test -c /dev/kvm || { echo "/dev/kvm is missing; enable nested virtualization" >&2; exit 1; }
    if ! mountpoint -q "$ROOT"; then
      # shellcheck disable=SC2206
      disks=($DEVICES)
      [ -e "${disks[0]}" ] || { echo "no local SSD matches $DEVICES" >&2; exit 1; }
      if [ "${#disks[@]}" -eq 1 ]; then
        device="$(readlink -f "${disks[0]}")"
      else
        # Reuse an array the kernel assembled at boot; otherwise stripe the SSDs.
        first="$(basename "$(readlink -f "${disks[0]}")")"
        device=""
        for slaves in /sys/block/md*/slaves; do
          if [ -e "$slaves/$first" ]; then device="/dev/$(basename "$(dirname "$slaves")")"; fi
        done
        if [ -z "$device" ]; then
          device=/dev/md0
          mdadm --create "$device" --level=0 --force --run \
            --raid-devices="${#disks[@]}" "${disks[@]}"
        fi
      fi
      fstype="$(blkid -s TYPE -o value "$device" || true)"
      if [ -z "$fstype" ]; then
        mkfs.xfs -q "$device"
      elif [ "$fstype" != xfs ]; then
        echo "$device contains $fstype; refusing to replace it with XFS" >&2
        exit 1
      fi
      mkdir -p "$ROOT"
      mount -o discard,defaults "$device" "$ROOT"
      echo "mounted $device at $ROOT"
    fi
    if [ "$(findmnt -n -o FSTYPE -T "$ROOT")" != xfs ] ||
       [ "$(findmnt -n -o FSROOT -T "$ROOT")" != / ]; then
      echo "$ROOT must be the root of an XFS filesystem" >&2
      exit 1
    fi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sandbox-node-init
  namespace: braintrust-sandbox
spec:
  selector:
    matchLabels:
      app: sandbox-node-init
  template:
    metadata:
      labels:
        app: sandbox-node-init
    spec:
      nodeSelector:
        braintrust.io/workload: sandbox-service
      tolerations:
        - key: braintrust.io/sandbox
          operator: Equal
          value: "true"
          effect: NoSchedule
      hostPID: true
      automountServiceAccountToken: false
      initContainers:
        - name: init
          image: ubuntu:24.04
          # Run in the host mount namespace so kubelet sees the mount.
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - "$(SCRIPT)"
          env:
            - name: SCRIPT
              valueFrom:
                configMapKeyRef:
                  name: sandbox-node-init
                  key: init.sh
          securityContext:
            privileged: true
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
