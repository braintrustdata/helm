# Values for the Sandbox Service worker chart, installed in the isolated worker cluster.
# Every <...> value comes from the GCP Terraform output gke_isolated_workers.
hostname: "<discovery.hostname>"
image: public.ecr.aws/braintrust/sandbox-service:b96d95eaa269031cdd6f286a17b9b3e4795355d1
# Fixed worker capacity. The worker node pool autoscales, so raising this is a values change.
replicas: 1
gitResources: true
nodePrep:
  enabled: true
prewarmTemplates:
  - image: public.ecr.aws/braintrust/codex-runtime@sha256:35db9c98d4a74e20758a29b82f8a3a6552be0002eb439c8c1a0f434ac573ee21
    resources:
      vcpu_count: 1
      memory_mib: 2048
    mounts: []
    durable_file_systems: []
    policy:
      networking:
        type: disabled
      credentials: []
    default_workdir: /home/exo/workspace
externalDns:
  enabled: true
  provider: google
  # One entry per argument in discovery.external_dns_extra_args.
  extraArgs:
    - "<argument>"
