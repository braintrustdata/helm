# Canonical public route ownership for API workload isolation.
#
# This is product-controlled rather than a chart value: changing it changes
# which API pool receives customer traffic. Ingress and gateway integrations
# must implement this contract and retain the default API Service for all
# unmatched requests.
version: v1
pools:
  ingest:
    routes:
      - path: /logs3
        pathType: exact
        method: POST
      - path: /otel/v1/traces
        pathType: exact
        method: POST
      - path: /attachment
        pathType: exact
        method: POST
      - path: /attachment/status
        pathType: exact
        method: POST
  background:
    routes:
      # Keep this distinct from the trailing-slash prefix. Istio URI
      # prefixes are string prefixes, so /v1/eval would also match
      # /v1/evaluate.
      - path: /v1/eval
        pathType: exact
        method: POST
      - path: /v1/eval/
        pathType: prefix
        method: POST
      - path: /function/eval
        pathType: exact
        method: POST
      - path: /function/sandbox
        pathType: exact
        method: POST
      - path: /function/use
        pathType: exact
        method: POST
      - path: /function/invoke-async-batch
        pathType: exact
        method: POST
      - path: /function/insert-functions
        pathType: exact
        method: POST
      - path: /automation/logs/trigger
        pathType: exact
        method: POST
      - path: /v1/proxy/chat/completions
        pathType: exact
      - path: /v1/proxy/responses
        pathType: exact
