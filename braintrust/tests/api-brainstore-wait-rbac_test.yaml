suite: test API Brainstore wait RBAC
templates:
  - api-brainstore-wait-rbac.yaml
tests:
  - it: should render a Role and RoleBinding for the Brainstore rollout gate
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: braintrust
    asserts:
      - hasDocuments:
          count: 2

  - it: should grant read-only access to the Brainstore Deployments
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: braintrust
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: kind
          value: Role
      - equal:
          path: metadata.name
          value: braintrust-api-brainstore-wait
      - equal:
          path: rules[0]
          value:
            apiGroups:
              - apps
            resources:
              - deployments
            resourceNames:
              - brainstore-reader
              - brainstore-fastreader
              - brainstore-writer
            verbs:
              - get
              - list
              - watch

  - it: should bind the rollout gate to the API service account
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: braintrust
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: kind
          value: RoleBinding
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: braintrust-api
            namespace: braintrust
