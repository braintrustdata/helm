suite: test Loop Runtime egress gateway Service template
templates:
  - loop-runtime-egress-service.yaml
tests:
  - it: should not render when Loop Runtime is disabled
    values:
      - __fixtures__/base-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should expose the Git proxy on an internal load balancer at the reserved address
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    release:
      namespace: braintrust
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: braintrust-loop-runtime-egress
      - equal:
          path: metadata.annotations["networking.gke.io/load-balancer-type"]
          value: Internal
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.loadBalancerIP
          value: 10.0.0.50
      - equal:
          path: spec.loadBalancerSourceRanges
          value:
            - 10.64.64.0/24
            - 10.64.0.0/18
      - equal:
          path: spec.selector.app
          value: braintrust-loop-runtime
      - equal:
          path: spec.ports
          value:
            - name: egress
              protocol: TCP
              port: 4002
              targetPort: 4002

  - it: should follow a custom service name and Git proxy port
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.service.name: loop
      loopRuntime.sandbox.egressGateway.port: 5002
    asserts:
      - equal:
          path: metadata.name
          value: loop-egress
      - equal:
          path: spec.ports[0].port
          value: 5002
      - equal:
          path: spec.ports[0].targetPort
          value: 5002
