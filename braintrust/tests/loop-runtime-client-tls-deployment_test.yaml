suite: Loop TLS rotation and runtime configuration
templates:
  - loop-runtime-deployment.yaml
  - loop-runtime-configmap.yaml
tests:
  - it: hashes initial TLS into the runtime pod template
    template: loop-runtime-deployment.yaml
    values: &managed
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
      - __fixtures__/loop-runtime-client-tls-values.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]
          value: 660a1560be62d8cb0ddd6b4b405ec467aaab39eed9f5152df74c256fe438c907

  - it: hashes rotated TLS into the runtime pod template
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: test-client-cert
        client.key: rotated-client-key
        server-ca.pem: test-server-ca
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]
          value: 447d999457179d90719cc975c84a2d9588d11d9e676b04bb835094aceb7c2d9a

  - it: omits the TLS checksum for external TLS null
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls: null
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: omits the TLS checksum for external TLS {}
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.sandbox.clientTls: {}
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: keeps managed TLS compatible with default replicas
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.replicas: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: keeps managed TLS compatible with null replicas
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.replicas: null
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: keeps managed TLS compatible with empty replicas
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.replicas: ""
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: keeps managed TLS compatible with zero replicas
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.replicas: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: renders managed TLS alongside image tag v2.24.0
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.image.tag: "v2.24.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test/loop-runtime:v2.24.0"
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: renders managed TLS alongside image tag 2.24.0
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.image.tag: "2.24.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test/loop-runtime:2.24.0"
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: renders managed TLS alongside image tag abcdef0123456789abcdef0123456789abcdef0123
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.image.tag: "abcdef0123456789abcdef0123456789abcdef0123"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test/loop-runtime:abcdef0123456789abcdef0123456789abcdef0123"
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: renders managed TLS alongside image tag abc1234
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.image.tag: "abc1234"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test/loop-runtime:abc1234"
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: renders managed TLS alongside image tag 1234567
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.image.tag: "1234567"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test/loop-runtime:1234567"
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: renders managed TLS alongside image tag v2.24.0-rc.1
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.image.tag: "v2.24.0-rc.1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test/loop-runtime:v2.24.0-rc.1"
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]

  - it: renders managed TLS alongside image tag custom-build
    template: loop-runtime-deployment.yaml
    values: *managed
    set:
      loopRuntime.image.tag: "custom-build"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test/loop-runtime:custom-build"
      - exists:
          path: spec.template.metadata.annotations["checksum/sandbox-client-tls"]
