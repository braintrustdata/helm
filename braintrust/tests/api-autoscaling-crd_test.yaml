suite: test GKE autoscaling CRD requirements
templates:
  - api-hpa.yaml
  - loop-runtime-hpa.yaml
# Do not advertise autoscaling.gke.io here — this suite asserts the fail path.
tests:
  - it: should fail when AutoscalingMetric API is unavailable
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorPattern: "api\\.autoscaling requires the AutoscalingMetric API \\(autoscaling\\.gke\\.io/v1beta1\\)"

  - it: should require the AutoscalingMetric API for Loop Runtime autoscaling
    template: loop-runtime-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.autoscaling.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "loopRuntime\\.autoscaling requires the AutoscalingMetric API"
