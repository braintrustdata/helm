suite: Native TLS loading with startup ordering
tests:
  - it: loads credentials after the existing migration and Brainstore checks
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      deploymentOrdering.enabled: true
      loopRuntime.sandbox.clientTlsSecret: projects/test-project/secrets/loop-client-tls/versions/17
    asserts:
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: sandbox-tls-init
      - equal:
          path: spec.template.spec.initContainers[2].env[1].value
          value: projects/test-project/secrets/loop-client-tls/versions/17
