suite: Loop Runtime sandbox capacity target
templates:
  - loop-runtime-configmap.yaml
  - loop-runtime-hpa.yaml
capabilities:
  apiVersions:
    - autoscaling.gke.io/v1beta1
tests:
  - it: omits capacity configuration when Loop is disabled
    template: loop-runtime-configmap.yaml
    values:
      - __fixtures__/base-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the worker target at fifty percent without the runtime HPA
    values: &values
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    asserts:
      - equal: &defaultTarget
          path: data.LOOP_RUNTIME_SANDBOX_CAPACITY_TARGET_UTILIZATION_PERCENT
          value: "50"
        template: loop-runtime-configmap.yaml
      - hasDocuments:
          count: 0
        template: loop-runtime-hpa.yaml

  - it: shares a custom enabled HPA target with sandbox workers
    values: *values
    set:
      loopRuntime.autoscaling.enabled: true
      loopRuntime.autoscaling.targetConversationUtilization: "70"
    asserts:
      - equal:
          path: data.LOOP_RUNTIME_SANDBOX_CAPACITY_TARGET_UTILIZATION_PERCENT
          value: "70"
        template: loop-runtime-configmap.yaml
      - equal:
          path: spec.metrics[0].pods.target.averageValue
          value: "70"
        template: loop-runtime-hpa.yaml

  - it: preserves fractional utilization targets supported by the runtime
    values: *values
    set:
      loopRuntime.autoscaling.enabled: true
      loopRuntime.autoscaling.targetConversationUtilization: 35.5
    asserts:
      - equal:
          path: data.LOOP_RUNTIME_SANDBOX_CAPACITY_TARGET_UTILIZATION_PERCENT
          value: "35.5"
        template: loop-runtime-configmap.yaml
      - equal:
          path: spec.metrics[0].pods.target.averageValue
          value: "35.5"
        template: loop-runtime-hpa.yaml

  - it: preserves sub-percent HPA targets while respecting the runtime minimum
    values: *values
    set:
      loopRuntime.autoscaling.enabled: true
      loopRuntime.autoscaling.targetConversationUtilization: "0.5"
    asserts:
      - equal:
          path: data.LOOP_RUNTIME_SANDBOX_CAPACITY_TARGET_UTILIZATION_PERCENT
          value: "1"
        template: loop-runtime-configmap.yaml
      - equal:
          path: spec.metrics[0].pods.target.averageValue
          value: "0.5"
        template: loop-runtime-hpa.yaml

  - it: tolerates retained values without an autoscaling map
    template: loop-runtime-configmap.yaml
    values: *values
    set:
      loopRuntime.autoscaling: null
    asserts:
      - equal: *defaultTarget

  - it: fills the capacity target for partial reused autoscaling values
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
      - __fixtures__/reuse-loop-runtime-autoscaling-values.yaml
    set:
      loopRuntime.autoscaling.enabled: true
    asserts:
      - equal: *defaultTarget
        template: loop-runtime-configmap.yaml
      - equal:
          path: spec.metrics[0].pods.target.averageValue
          value: "50"
        template: loop-runtime-hpa.yaml

  - it: defaults a null target when the HPA is enabled
    template: loop-runtime-configmap.yaml
    values: *values
    set:
      loopRuntime.autoscaling.enabled: true
      loopRuntime.autoscaling.targetConversationUtilization: null
    asserts:
      - equal: *defaultTarget

  - it: continues ignoring unused HPA targets when it is disabled
    template: loop-runtime-configmap.yaml
    values: *values
    set:
      loopRuntime.autoscaling.targetConversationUtilization: 0
    asserts:
      - equal: *defaultTarget

  - it: rejects a zero enabled HPA target before starting the runtime
    template: loop-runtime-hpa.yaml
    values: *values
    set:
      loopRuntime.autoscaling.enabled: true
      loopRuntime.autoscaling.targetConversationUtilization: 0
    asserts: &invalidTarget
      - failedTemplate:
          errorMessage: loopRuntime.autoscaling.targetConversationUtilization must be greater than 0 and at most 100

  - it: rejects an empty enabled HPA target
    template: loop-runtime-hpa.yaml
    values: *values
    set:
      loopRuntime.autoscaling.enabled: true
      loopRuntime.autoscaling.targetConversationUtilization: ""
    asserts: *invalidTarget

  - it: rejects an enabled HPA target above one hundred
    template: loop-runtime-hpa.yaml
    values: *values
    set:
      loopRuntime.autoscaling.enabled: true
      loopRuntime.autoscaling.targetConversationUtilization: "101"
    asserts: *invalidTarget
