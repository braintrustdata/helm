suite: Loop client TLS installed from generated Helm values
templates:
  - loop-runtime-client-tls.yaml
tests:
  - it: installs the client identity in the release namespace
    template: loop-runtime-client-tls.yaml
    values: &managed
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
      - __fixtures__/loop-runtime-client-tls-values.yaml
    release:
      namespace: custom-runtime
    set:
      global.createNamespace: false
    asserts:
      - equal:
          path: metadata.name
          value: sandbox-client-tls
      - equal:
          path: metadata.namespace
          value: custom-runtime
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data["client.pem"]
          value: dGVzdC1jbGllbnQtY2VydA==
      - equal:
          path: data["client.key"]
          value: dGVzdC1jbGllbnQta2V5
      - equal:
          path: data["server-ca.pem"]
          value: dGVzdC1zZXJ2ZXItY2E=

  - it: leaves external client TLS ownership unchanged when the field is absent
    template: loop-runtime-client-tls.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps reused pre-Loop values disabled
    template: loop-runtime-client-tls.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/pre-loop-runtime-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: leaves external TLS alone for null
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls: null
    asserts:
      - hasDocuments:
          count: 0

  - it: leaves external TLS alone for an empty map
    template: loop-runtime-client-tls.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.sandbox.clientTls: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: omits managed TLS with Loop disabled on google
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      cloud: google
      loopRuntime.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: omits managed TLS with Loop disabled on aws
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      cloud: aws
      loopRuntime.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: omits managed TLS with Loop disabled on azure
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      cloud: azure
      loopRuntime.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: retains the unsupported cloud check for aws
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      cloud: aws
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.enabled requires cloud: google. On AWS, Loop Runtime runs on ECS through the Terraform module."

  - it: retains the unsupported cloud check for azure
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      cloud: azure
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.enabled requires cloud: google. On AWS, Loop Runtime runs on ECS through the Terraform module."

  - it: rejects a TLS empty string
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls: ""
    asserts:
      - failedTemplate:
          errorMessage: loopRuntime.sandbox.clientTls must be a map or null

  - it: rejects a TLS string
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls: not-a-map
    asserts:
      - failedTemplate:
          errorMessage: loopRuntime.sandbox.clientTls must be a map or null

  - it: rejects a TLS number
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls: 0
    asserts:
      - failedTemplate:
          errorMessage: loopRuntime.sandbox.clientTls must be a map or null

  - it: rejects a TLS boolean
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls: false
    asserts:
      - failedTemplate:
          errorMessage: loopRuntime.sandbox.clientTls must be a map or null

  - it: rejects a missing client key
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: test-client-cert
        client.key: null
        server-ca.pem: test-server-ca
    asserts:
      - failedTemplate:
          errorMessage: 'loopRuntime.sandbox.clientTls[client.key] is required and must be a non-empty string'

  - it: rejects a empty client key
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: test-client-cert
        client.key: ""
        server-ca.pem: test-server-ca
    asserts:
      - failedTemplate:
          errorMessage: 'loopRuntime.sandbox.clientTls[client.key] is required and must be a non-empty string'

  - it: rejects a numeric client key
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: test-client-cert
        client.key: 42
        server-ca.pem: test-server-ca
    asserts:
      - failedTemplate:
          errorMessage: 'loopRuntime.sandbox.clientTls[client.key] is required and must be a non-empty string'

  - it: rejects a missing client.pem
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: null
        client.key: test-client-key
        server-ca.pem: test-server-ca
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.clientTls[client.pem] is required and must be a non-empty string"

  - it: rejects a empty client.pem
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: ""
        client.key: test-client-key
        server-ca.pem: test-server-ca
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.clientTls[client.pem] is required and must be a non-empty string"

  - it: rejects a numeric client.pem
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: 42
        client.key: test-client-key
        server-ca.pem: test-server-ca
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.clientTls[client.pem] is required and must be a non-empty string"

  - it: rejects a missing server-ca.pem
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: test-client-cert
        client.key: test-client-key
        server-ca.pem: null
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.clientTls[server-ca.pem] is required and must be a non-empty string"

  - it: rejects a empty server-ca.pem
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: test-client-cert
        client.key: test-client-key
        server-ca.pem: ""
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.clientTls[server-ca.pem] is required and must be a non-empty string"

  - it: rejects a numeric server-ca.pem
    template: loop-runtime-client-tls.yaml
    values: *managed
    set:
      loopRuntime.sandbox.clientTls:
        client.pem: test-client-cert
        client.key: test-client-key
        server-ca.pem: 42
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.clientTls[server-ca.pem] is required and must be a non-empty string"
