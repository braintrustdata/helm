suite: test API autoscaling templates
templates:
  - api-autoscaling-metric.yaml
  - api-hpa.yaml
  - api-autoscaling-prometheus.yaml
  - api-autoscaling-prometheus-adapter.yaml
  - api-deployment.yaml
  - api-configmap.yaml
capabilities:
  apiVersions:
    - autoscaling.gke.io/v1beta1
tests:
  - it: should not render AutoscalingMetric when autoscaling is disabled
    template: api-autoscaling-metric.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: false
    release:
      namespace: "braintrust"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render HPA when autoscaling is disabled
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: false
    release:
      namespace: "braintrust"
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when autoscaling is enabled on an unsupported cloud
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/azure-values.yaml
    set:
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "api.autoscaling is currently only supported when cloud is google (GKE) or aws (EKS)"

  - it: should render AutoscalingMetric for GKE with event-loop gauges
    template: api-autoscaling-metric.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - isKind:
          of: AutoscalingMetric
      - equal:
          path: apiVersion
          value: autoscaling.gke.io/v1beta1
      - equal:
          path: metadata.name
          value: braintrust-api
      - equal:
          path: metadata.namespace
          value: braintrust
      - equal:
          path: spec.metrics[0].pod.selector.matchLabels.app
          value: braintrust-api
      - equal:
          path: spec.metrics[0].pod.containers[0].endpoint.port
          value: 8001
      - equal:
          path: spec.metrics[0].pod.containers[0].endpoint.path
          value: /metrics
      - equal:
          path: spec.metrics[0].pod.containers[0].metrics[0].gauge.name
          value: braintrust-api-event-loop-utilization-ratio
      - equal:
          path: spec.metrics[0].pod.containers[0].metrics[0].gauge.prometheusMetricName
          value: braintrust_api_event_loop_utilization_ratio
      - equal:
          path: spec.metrics[0].pod.containers[0].metrics[1].gauge.name
          value: braintrust-api-event-loop-delay-mean-seconds
      - equal:
          path: spec.metrics[0].pod.containers[0].metrics[1].gauge.prometheusMetricName
          value: braintrust_api_event_loop_delay_mean_seconds

  - it: should render HPA with CPU and event-loop metrics matching AWS ECS defaults
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: apiVersion
          value: autoscaling/v2
      - equal:
          path: metadata.name
          value: braintrust-api
      - equal:
          path: spec.scaleTargetRef.name
          value: braintrust-api
      - equal:
          path: spec.minReplicas
          value: 4
      - equal:
          path: spec.maxReplicas
          value: 50
      - equal:
          path: spec.metrics[0].type
          value: ContainerResource
      - equal:
          path: spec.metrics[0].containerResource.name
          value: cpu
      - equal:
          path: spec.metrics[0].containerResource.container
          value: api
      - equal:
          path: spec.metrics[0].containerResource.target.averageUtilization
          value: 50
      - equal:
          path: spec.metrics[1].pods.metric.name
          value: autoscaling.gke.io|braintrust-api|braintrust-api-event-loop-utilization-ratio
      - equal:
          path: spec.metrics[1].pods.target.averageValue
          value: "0.4"
      - equal:
          path: spec.metrics[2].pods.metric.name
          value: autoscaling.gke.io|braintrust-api|braintrust-api-event-loop-delay-mean-seconds
      - equal:
          path: spec.metrics[2].pods.target.averageValue
          value: "0.05"
      - lengthEqual:
          path: spec.metrics
          count: 3
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
      - equal:
          path: spec.behavior.scaleUp.stabilizationWindowSeconds
          value: 60

  - it: should omit Deployment replicas and expose metrics port when autoscaling is enabled
    template: api-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.replicas: 4
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: spec.replicas
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 8000
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 8001
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_PROMETHEUS_METRICS
            value: "true"

  - it: should set ENABLE_PROMETHEUS_METRICS after extraEnvVars so autoscaling wins
    template: api-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.extraEnvVars:
        - name: ENABLE_PROMETHEUS_METRICS
          value: "false"
        - name: SOME_OTHER_VAR
          value: "x"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[-1].name
          value: ENABLE_PROMETHEUS_METRICS
      - equal:
          path: spec.template.spec.containers[0].env[-1].value
          value: "true"

  - it: should keep Deployment replicas when autoscaling is disabled
    template: api-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: false
      api.replicas: 4
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: spec.replicas
          value: 4
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 8001
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_PROMETHEUS_METRICS
            value: "true"

  - it: should render three HPAs when workload isolation and autoscaling are enabled
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - hasDocuments:
          count: 3

  - it: should scale the default pool with inherited autoscaling capacity
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
    release:
      namespace: "braintrust"
    documentSelector:
      path: metadata.name
      value: braintrust-api
    asserts:
      - equal:
          path: spec.minReplicas
          value: 4
      - equal:
          path: spec.maxReplicas
          value: 50
      - equal:
          path: metadata.labels["braintrust.dev/api-pool"]
          value: default

  - it: should scale the ingest pool with pool-specific capacity overrides
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
    release:
      namespace: "braintrust"
    documentSelector:
      path: metadata.name
      value: braintrust-api-ingest
    asserts:
      - equal:
          path: metadata.labels["braintrust.dev/api-pool"]
          value: ingest
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 200
      - equal:
          path: spec.metrics[1].pods.metric.name
          value: autoscaling.gke.io|braintrust-api-ingest|braintrust-api-event-loop-utilization-ratio

  - it: should scale the background pool with pool-specific capacity overrides
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
    release:
      namespace: "braintrust"
    documentSelector:
      path: metadata.name
      value: braintrust-api-background
    asserts:
      - equal:
          path: metadata.labels["braintrust.dev/api-pool"]
          value: background
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 50

  - it: should scrape the ingest pool with a dedicated AutoscalingMetric
    template: api-autoscaling-metric.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
    release:
      namespace: "braintrust"
    documentSelector:
      path: metadata.name
      value: braintrust-api-ingest
    asserts:
      - equal:
          path: metadata.labels["braintrust.dev/api-pool"]
          value: ingest
      - equal:
          path: spec.metrics[0].pod.selector.matchLabels.app
          value: braintrust-api-ingest

  - it: should omit replicas on the ingest pool when autoscaling is enabled
    template: api-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
    release:
      namespace: "braintrust"
    documentSelector:
      path: metadata.name
      value: braintrust-api-ingest
    asserts:
      - isNull:
          path: spec.replicas
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_PROMETHEUS_METRICS
            value: "true"

  - it: should not render an HPA for a pool with autoscaling disabled
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
      api.workloadIsolation.ingest.autoscaling.enabled: false
    release:
      namespace: "braintrust"
    documentSelector:
      path: metadata.name
      value: braintrust-api-ingest
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
          filterAware: true

  - it: should still scale sibling pools when one pool disables autoscaling
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
      api.workloadIsolation.ingest.autoscaling.enabled: false
    release:
      namespace: "braintrust"
    asserts:
      - hasDocuments:
          count: 2

  - it: should keep fixed replicas on a pool with autoscaling disabled
    template: api-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
      api.workloadIsolation.ingest.autoscaling.enabled: false
      api.workloadIsolation.ingest.replicas: 3
    release:
      namespace: "braintrust"
    documentSelector:
      path: metadata.name
      value: braintrust-api-ingest
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_PROMETHEUS_METRICS
            value: "true"

  - it: should not scrape a pool with autoscaling disabled
    template: api-autoscaling-metric.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
      api.workloadIsolation.ingest.autoscaling.enabled: false
    release:
      namespace: "braintrust"
    documentSelector:
      path: metadata.name
      value: braintrust-api-ingest
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
          filterAware: true

  - it: should not render GKE AutoscalingMetric on AWS
    template: api-autoscaling-metric.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/aws-values.yaml
    set:
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render Prometheus stack on GKE
    template: api-autoscaling-prometheus.yaml
    values:
      - __fixtures__/base-values.yaml
    set:
      cloud: google
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - hasDocuments:
          count: 0

  - it: should render HPA on AWS with prometheus-adapter metric names
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/aws-values.yaml
    set:
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.metrics[0].type
          value: ContainerResource
      - equal:
          path: spec.metrics[0].containerResource.container
          value: api
      - equal:
          path: spec.metrics[1].pods.metric.name
          value: event_loop_utilization_ratio
      - equal:
          path: spec.metrics[1].pods.target.averageValue
          value: "0.4"
      - equal:
          path: spec.metrics[2].pods.metric.name
          value: event_loop_delay_mean_seconds
      - equal:
          path: spec.metrics[2].pods.target.averageValue
          value: "0.05"

  - it: should scrape health server metrics on AWS Prometheus
    template: api-autoscaling-prometheus.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/aws-values.yaml
    set:
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: ":8001"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "metrics_path: /metrics"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "regex: braintrust-api"

  - it: should scrape all API pools on AWS when workload isolation is enabled
    template: api-autoscaling-prometheus.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/aws-values.yaml
    set:
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "braintrust-api-ingest"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "braintrust-api-background"

  - it: should render three HPAs on AWS when workload isolation is enabled
    template: api-hpa.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/aws-values.yaml
    set:
      api.autoscaling.enabled: true
      api.workloadIsolation.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - hasDocuments:
          count: 3

  - it: should render prometheus-adapter rules for event-loop gauges on AWS
    template: api-autoscaling-prometheus-adapter.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/aws-values.yaml
    set:
      api.autoscaling.enabled: true
    release:
      namespace: "braintrust"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "braintrust_api_event_loop_delay_mean_seconds"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "braintrust_api_event_loop_utilization_ratio"
