suite: test API configmap template
templates:
  - api-configmap.yaml
tests:
  - it: should render API configmap with default values
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: braintrust-api
      - equal:
          path: data.ORG_NAME
          value: "test-org"
      - equal:
          path: data.PRIMARY_ORG_NAME
          value: ""
      - equal:
          path: data.BRAINTRUST_LEGACY_IDS
          value: "true"
      - equal:
          path: data.BRAINSTORE_ENABLED
          value: "true"
      - equal:
          path: data.BRAINSTORE_DEFAULT
          value: "force"

  - it: should omit URL security env vars when unset
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: data.BRAINTRUST_UNSAFE_URL_REQUEST_MODE
      - isNull:
          path: data.BRAINTRUST_URL_SECURITY_DNS_SERVERS
      - isNull:
          path: data.BRAINTRUST_URL_SECURITY_ALLOW_CIDRS

  - it: should include URL security env vars when configured
    values:
      - __fixtures__/base-values.yaml
    set:
      api.unsafeUrlRequestMode: " reject "
      api.urlSecurityDnsServers: " 1.1.1.1,8.8.8.8 "
      api.urlSecurityAllowCidrs: " 10.0.0.0/8,192.168.0.0/16 "
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINTRUST_UNSAFE_URL_REQUEST_MODE
          value: "reject"
      - equal:
          path: data.BRAINTRUST_URL_SECURITY_DNS_SERVERS
          value: "1.1.1.1,8.8.8.8"
      - equal:
          path: data.BRAINTRUST_URL_SECURITY_ALLOW_CIDRS
          value: "10.0.0.0/8,192.168.0.0/16"

  - it: should omit allowed org IDs when unset
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: data.ALLOWED_ORG_IDS

  - it: should omit allowed org IDs when blank
    values:
      - __fixtures__/base-values.yaml
    set:
      global.allowedOrgIds: "   "
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: data.ALLOWED_ORG_IDS

  - it: should include allowed org IDs when configured
    values:
      - __fixtures__/base-values.yaml
    set:
      global.allowedOrgIds: " 00000000-0000-4000-8000-000000000001,00000000-0000-4000-8000-000000000002 "
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.ALLOWED_ORG_IDS
          value: "00000000-0000-4000-8000-000000000001,00000000-0000-4000-8000-000000000002"

  - it: should include primary org name when configured
    values:
      - __fixtures__/base-values.yaml
    set:
      global.primaryOrgName: " primary-org "
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.PRIMARY_ORG_NAME
          value: "primary-org"

  - it: should allow wildcard org name when primary org name is configured
    values:
      - __fixtures__/base-values.yaml
    set:
      global.orgName: "*"
      global.primaryOrgName: "primary-org"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.ORG_NAME
          value: "*"
      - equal:
          path: data.PRIMARY_ORG_NAME
          value: "primary-org"

  - it: should allow wildcard org name when primary org name is provided via module env vars
    values:
      - __fixtures__/base-values.yaml
    set:
      global.orgName: "*"
      global.primaryOrgName: ""
      api.platformEnvVars:
        - name: PRIMARY_ORG_NAME
          value: "primary-org"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.ORG_NAME
          value: "*"
      - equal:
          path: data.PRIMARY_ORG_NAME
          value: ""

  - it: should allow wildcard org name when primary org name is provided via extra env vars
    values:
      - __fixtures__/base-values.yaml
    set:
      global.orgName: "*"
      global.primaryOrgName: ""
      api.extraEnvVars:
        - name: PRIMARY_ORG_NAME
          value: "primary-org"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.ORG_NAME
          value: "*"
      - equal:
          path: data.PRIMARY_ORG_NAME
          value: ""

  - it: should reject empty org name without primary org name
    values:
      - __fixtures__/base-values.yaml
    set:
      global.orgName: ""
      global.primaryOrgName: ""
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "global.primaryOrgName or PRIMARY_ORG_NAME in api.platformEnvVars or api.extraEnvVars is required when global.orgName is empty or \"*\"; self-hosted service-token management needs a primary organization."

  - it: should reject wildcard org name without primary org name
    values:
      - __fixtures__/base-values.yaml
    set:
      global.orgName: "*"
      global.primaryOrgName: "   "
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "global.primaryOrgName or PRIMARY_ORG_NAME in api.platformEnvVars or api.extraEnvVars is required when global.orgName is empty or \"*\"; self-hosted service-token management needs a primary organization."

  - it: should use correct namespace from helper when createNamespace is false
    values:
      - __fixtures__/base-values.yaml
    set:
      global.namespace: "custom-ns"
      global.createNamespace: false
    release:
      namespace: "release-namespace"
    asserts:
      - equal:
          path: metadata.namespace
          value: release-namespace

  - it: should use global namespace when createNamespace is true
    values:
      - __fixtures__/base-values.yaml
    set:
      global.namespace: "custom-ns"
      global.createNamespace: true
    release:
      namespace: "release-namespace"
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns

  - it: should configure AWS buckets when cloud is aws
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/aws-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.RESPONSE_BUCKET
          value: "test-response-bucket"
      - equal:
          path: data.CODE_BUNDLE_BUCKET
          value: "test-code-bundle-bucket"
      - equal:
          path: data.BRAINSTORE_REALTIME_WAL_BUCKET
          value: "test-brainstore-bucket"

  - it: should configure Azure storage when cloud is azure
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/azure-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.AZURE_STORAGE_ACCOUNT_NAME
          value: "teststorageaccount"
      - equal:
          path: data.RESPONSE_BUCKET
          value: "responses"
      - equal:
          path: data.CODE_BUNDLE_BUCKET
          value: "code-bundles"
      - equal:
          path: data.BRAINSTORE_REALTIME_WAL_BUCKET
          value: "brainstore"
      - equal:
          path: data.BRAINSTORE_REALTIME_WAL_BUCKET_PREFIX
          value: "brainstore/wal"

  - it: should configure Google Cloud buckets when cloud is google
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.RESPONSE_BUCKET
          value: "test-api-bucket"
      - equal:
          path: data.RESPONSE_BUCKET_PREFIX
          value: "response/"
      - equal:
          path: data.CODE_BUNDLE_BUCKET
          value: "test-api-bucket"
      - equal:
          path: data.CODE_BUNDLE_BUCKET_PREFIX
          value: "code-bundle/"
      - equal:
          path: data.BRAINSTORE_REALTIME_WAL_BUCKET
          value: "test-brainstore-bucket"
      - equal:
          path: data.AWS_ENDPOINT_URL
          value: "https://storage.googleapis.com"
      - equal:
          path: data.AWS_REQUEST_CHECKSUM_CALCULATION
          value: "WHEN_REQUIRED"
      - equal:
          path: data.AWS_RESPONSE_CHECKSUM_VALIDATION
          value: "WHEN_REQUIRED"
      - isNull:
          path: data.AWS_REGION

  - it: should allow a Google HMAC deployment that sets AWS_REGION via extraEnvVars
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.platformEnvVars: []
      api.extraEnvVars:
        - name: AWS_REGION
          value: "us-central1"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.AWS_ENDPOINT_URL
          value: "https://storage.googleapis.com"

  - it: should allow a Google HMAC deployment that sets AWS_REGION via platformEnvVars
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.extraEnvVars: []
      api.platformEnvVars:
        - name: AWS_REGION
          value: "us-central1"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.AWS_ENDPOINT_URL
          value: "https://storage.googleapis.com"

  - it: should reject a Google HMAC deployment with no AWS_REGION
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.platformEnvVars: []
      api.extraEnvVars: []
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "api.platformEnvVars or api.extraEnvVars AWS_REGION is required when cloud is google and api.enableGcsAuth is false; S3-compatible GCS needs a region."

  - it: should reject a blank AWS_REGION literal in extraEnvVars
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.platformEnvVars: []
      api.extraEnvVars:
        - name: AWS_REGION
          value: ""
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "api.platformEnvVars or api.extraEnvVars AWS_REGION is required when cloud is google and api.enableGcsAuth is false; S3-compatible GCS needs a region."

  - it: should reject a name-only AWS_REGION entry
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.platformEnvVars: []
      api.extraEnvVars:
        - name: AWS_REGION
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "api.platformEnvVars or api.extraEnvVars AWS_REGION is required when cloud is google and api.enableGcsAuth is false; S3-compatible GCS needs a region."

  - it: should reject a whitespace-only AWS_REGION value
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.extraEnvVars: []
      api.platformEnvVars:
        - name: AWS_REGION
          value: "   "
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "api.platformEnvVars or api.extraEnvVars AWS_REGION is required when cloud is google and api.enableGcsAuth is false; S3-compatible GCS needs a region."

  - it: should reject a later blank AWS_REGION that overrides a real one
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.platformEnvVars:
        - name: AWS_REGION
          value: "us-central1"
      api.extraEnvVars:
        - name: AWS_REGION
          value: ""
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "api.platformEnvVars or api.extraEnvVars AWS_REGION is required when cloud is google and api.enableGcsAuth is false; S3-compatible GCS needs a region."

  - it: should allow AWS_REGION from valueFrom without a literal value
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.platformEnvVars: []
      api.extraEnvVars:
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: braintrust-secrets
              key: AWS_REGION
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.AWS_ENDPOINT_URL
          value: "https://storage.googleapis.com"

  - it: should let a later literal AWS_REGION replace a blank platform entry
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.platformEnvVars:
        - name: AWS_REGION
          value: ""
      api.extraEnvVars:
        - name: AWS_REGION
          value: "us-central1"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.AWS_ENDPOINT_URL
          value: "https://storage.googleapis.com"

  - it: should reject a whitespace-only env name as AWS_REGION
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.extraEnvVars: []
      api.platformEnvVars:
        - name: "   "
          value: "us-central1"
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "api.platformEnvVars or api.extraEnvVars AWS_REGION is required when cloud is google and api.enableGcsAuth is false; S3-compatible GCS needs a region."

  - it: should not set checksum vars when enableGcsAuth is true
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.enableGcsAuth: true
      api.serviceAccount.googleServiceAccount: "test@project.iam.gserviceaccount.com"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.ENABLE_GCS_AUTH
          value: "true"
      - isNull:
          path: data.AWS_ENDPOINT_URL
      - isNull:
          path: data.AWS_REQUEST_CHECKSUM_CALCULATION
      - isNull:
          path: data.AWS_RESPONSE_CHECKSUM_VALIDATION
      - isNull:
          path: data.AWS_REGION
      - isNull:
          path: data.AWS_DEFAULT_REGION

  - it: should not require a GCS region when enableGcsAuth is true
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    set:
      api.enableGcsAuth: true
      api.serviceAccount.googleServiceAccount: "test@project.iam.gserviceaccount.com"
      api.platformEnvVars: []
      api.extraEnvVars: []
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.ENABLE_GCS_AUTH
          value: "true"
      - isNull:
          path: data.AWS_REGION

  - it: should configure brainstore URLs correctly
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_URL
          value: "http://brainstore-reader.braintrust:4000"
      - equal:
          path: data.BRAINSTORE_FAST_READER_URL
          value: "http://brainstore-fastreader.braintrust:4000"
      - equal:
          path: data.BRAINSTORE_FAST_READER_QUERY_SOURCES
          value: "summaryPaginatedObjectViewer [realtime],summaryPaginatedObjectViewer,a602c972-1843-4ee1-b6bc-d3c1075cd7e7,traceQueryFn-id,traceQueryFn-rootSpanId,fullSpanQueryFn-root_span_id,fullSpanQueryFn-id"
      - equal:
          path: data.BRAINSTORE_WRITER_URL
          value: "http://brainstore-writer.braintrust:4000"

  - it: should include control plane telemetry
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.CONTROL_PLANE_TELEMETRY
          value: "status,metrics"

  - it: should merge global and api labels
    values:
      - __fixtures__/base-values.yaml
    set:
      api.labels.component: "api"
      global.labels.environment: "production"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: metadata.labels.environment
          value: production
      - equal:
          path: metadata.labels.component
          value: api

  - it: should include configmap annotations when provided
    values:
      - __fixtures__/base-values.yaml
    set:
      api.annotations.configmap:
        custom-annotation: "value"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: value

  - it: should configure backfill settings
    values:
      - __fixtures__/base-values.yaml
    set:
      api.backfillDisableHistorical: true
      api.backfillDisableNonhistorical: true
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_BACKFILL_DISABLE_HISTORICAL
          value: "true"
      - equal:
          path: data.BRAINSTORE_BACKFILL_DISABLE_NONHISTORICAL
          value: "true"

  - it: should not include WAL or no-pg vars when neither is set
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstoreWalFooterVersion: ""
      skipPgForBrainstoreObjects: ""
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: data.BRAINSTORE_WAL_FOOTER_VERSION
      - isNull:
          path: data.BRAINSTORE_WAL_USE_EFFICIENT_FORMAT
      - isNull:
          path: data.SKIP_PG_FOR_BRAINSTORE_OBJECTS

  - it: should set WAL_FOOTER_VERSION and WAL_USE_EFFICIENT_FORMAT when only brainstoreWalFooterVersion is set
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstoreWalFooterVersion: "v1"
      skipPgForBrainstoreObjects: ""
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_WAL_FOOTER_VERSION
          value: "v1"
      - equal:
          path: data.BRAINSTORE_WAL_USE_EFFICIENT_FORMAT
          value: "true"
      - isNull:
          path: data.SKIP_PG_FOR_BRAINSTORE_OBJECTS

  - it: should set SKIP_PG and WAL_USE_EFFICIENT_FORMAT when only skipPgForBrainstoreObjects is set
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstoreWalFooterVersion: ""
      skipPgForBrainstoreObjects: "all"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.SKIP_PG_FOR_BRAINSTORE_OBJECTS
          value: "all"
      - equal:
          path: data.BRAINSTORE_WAL_USE_EFFICIENT_FORMAT
          value: "true"
      - isNull:
          path: data.BRAINSTORE_WAL_FOOTER_VERSION

  - it: should set all three vars when both brainstoreWalFooterVersion and skipPgForBrainstoreObjects are set
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstoreWalFooterVersion: "v3"
      skipPgForBrainstoreObjects: "all"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_WAL_FOOTER_VERSION
          value: "v3"
      - equal:
          path: data.SKIP_PG_FOR_BRAINSTORE_OBJECTS
          value: "all"
      - equal:
          path: data.BRAINSTORE_WAL_USE_EFFICIENT_FORMAT
          value: "true"

  - it: should pass through include-style skipPgForBrainstoreObjects value
    values:
      - __fixtures__/base-values.yaml
    set:
      skipPgForBrainstoreObjects: "include:project_logs:abc123"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_WAL_USE_EFFICIENT_FORMAT
          value: "true"
      - equal:
          path: data.SKIP_PG_FOR_BRAINSTORE_OBJECTS
          value: "include:project_logs:abc123"

  - it: should not include GATEWAY_URL when aiGateway useGateway is false
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: data.GATEWAY_URL

  - it: should not include GATEWAY_URL when aiGateway is deployed but useGateway is false
    values:
      - __fixtures__/base-values.yaml
    set:
      aiGateway.enabled: true
      aiGateway.useGateway: false
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: data.GATEWAY_URL

  - it: should set GATEWAY_URL when aiGateway useGateway is true
    values:
      - __fixtures__/base-values.yaml
    set:
      aiGateway.enabled: true
      aiGateway.useGateway: true
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.GATEWAY_URL
          value: "http://braintrust-ai-gateway.braintrust:8080"

  - it: should use custom aiGateway service name for GATEWAY_URL
    values:
      - __fixtures__/base-values.yaml
    set:
      aiGateway.enabled: true
      aiGateway.useGateway: true
      aiGateway.service.name: "custom-ai-gateway"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.GATEWAY_URL
          value: "http://custom-ai-gateway.braintrust:8080"

  - it: should pass through exclude-style skipPgForBrainstoreObjects value
    values:
      - __fixtures__/base-values.yaml
    set:
      skipPgForBrainstoreObjects: "exclude:project_logs:abc123"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_WAL_USE_EFFICIENT_FORMAT
          value: "true"
      - equal:
          path: data.SKIP_PG_FOR_BRAINSTORE_OBJECTS
          value: "exclude:project_logs:abc123"

  - it: should omit BTQL audit log env vars when both lists are empty
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: data.BTQL_AUDIT_LOGS_STRICT_ORG_IDS
      - isNull:
          path: data.BTQL_AUDIT_LOGS_BEST_EFFORT_ORG_IDS

  - it: should set BTQL_AUDIT_LOGS_STRICT_ORG_IDS when strict org IDs are configured
    values:
      - __fixtures__/base-values.yaml
    set:
      btqlAuditLogsStrictOrgIds:
        - "00000000-0000-4000-8000-000000000001"
        - "00000000-0000-4000-8000-000000000002"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BTQL_AUDIT_LOGS_STRICT_ORG_IDS
          value: "00000000-0000-4000-8000-000000000001,00000000-0000-4000-8000-000000000002"
      - isNull:
          path: data.BTQL_AUDIT_LOGS_BEST_EFFORT_ORG_IDS

  - it: should set BTQL_AUDIT_LOGS_BEST_EFFORT_ORG_IDS when best-effort org IDs are configured
    values:
      - __fixtures__/base-values.yaml
    set:
      btqlAuditLogsBestEffortOrgIds:
        - "00000000-0000-4000-8000-000000000001"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BTQL_AUDIT_LOGS_BEST_EFFORT_ORG_IDS
          value: "00000000-0000-4000-8000-000000000001"
      - isNull:
          path: data.BTQL_AUDIT_LOGS_STRICT_ORG_IDS

  - it: should fail when both strict and best-effort org IDs are set
    values:
      - __fixtures__/base-values.yaml
    set:
      btqlAuditLogsStrictOrgIds:
        - "00000000-0000-4000-8000-000000000001"
      btqlAuditLogsBestEffortOrgIds:
        - "00000000-0000-4000-8000-000000000002"
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
          errorMessage: "Set either btqlAuditLogsStrictOrgIds or btqlAuditLogsBestEffortOrgIds, not both."

  - it: should fail when a strict org ID is not a valid UUID
    values:
      - __fixtures__/base-values.yaml
    set:
      btqlAuditLogsStrictOrgIds:
        - "not-a-uuid"
    release:
      namespace: "braintrust"
    asserts:
      - failedTemplate:
