suite: test label merge isolation for service accounts (deepCopy fix)
templates:
  - api-serviceaccount.yaml
  - loop-runtime-serviceaccount.yaml
  - brainstore-serviceaccount.yaml
  - ai-gateway-serviceaccount.yaml
tests:
  # These tests verify the deepCopy fix for service accounts.
  # Without deepCopy, labels would bleed between components due to merge mutation.

  - it: should give API service account only global and api-specific labels
    values:
      - __fixtures__/base-values.yaml
    set:
      global.labels.shared: "global-sa"
      api.labels.api-specific: "api-sa"
      brainstore.labels.brainstore-specific: "brainstore-sa"
    release:
      namespace: "braintrust"
    template: api-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.labels.shared
          value: global-sa
      - equal:
          path: metadata.labels["api-specific"]
          value: api-sa
      - isNull:
          path: metadata.labels["brainstore-specific"]

  - it: should give Brainstore service account only global and brainstore-specific labels
    values:
      - __fixtures__/base-values.yaml
    set:
      global.labels.shared: "global-sa"
      api.labels.api-specific: "api-sa"
      brainstore.labels.brainstore-specific: "brainstore-sa"
    release:
      namespace: "braintrust"
    template: brainstore-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.labels.shared
          value: global-sa
      - equal:
          path: metadata.labels["brainstore-specific"]
          value: brainstore-sa
      - isNull:
          path: metadata.labels["api-specific"]

  - it: should give Loop Runtime service account only global and runtime-specific labels
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      global.labels.shared: "global-sa"
      loopRuntime.labels.loop-specific: "loop-sa"
      api.labels.api-specific: "api-sa"
      brainstore.labels.brainstore-specific: "brainstore-sa"
    release:
      namespace: "braintrust"
    template: loop-runtime-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.labels
          value:
            shared: global-sa
            loop-specific: loop-sa

  - it: keeps Gateway account labels and annotations scoped to that account
    template: ai-gateway-serviceaccount.yaml
    set: &gatewayIdentityLabels
      aiGateway.enabled: true
      global.labels.shared: global-sa
      global.labels.tier: global-tier
      aiGateway.labels.tier: gateway-tier
      aiGateway.labels.gateway-only: gateway-sa
      api.labels.api-only: api-sa
      aiGateway.annotations.serviceaccount:
        example.com/identity: gateway
      aiGateway.annotations.pod:
        example.com/pod-only: gateway-pod
    asserts:
      - equal:
          path: metadata.labels
          value:
            shared: global-sa
            tier: gateway-tier
            gateway-only: gateway-sa
      - equal:
          path: metadata.annotations
          value:
            example.com/identity: gateway

  - it: does not leak Gateway identity metadata into the API account
    template: api-serviceaccount.yaml
    set: *gatewayIdentityLabels
    asserts:
      - equal:
          path: metadata.labels
          value:
            shared: global-sa
            tier: global-tier
            api-only: api-sa
      - isNull:
          path: metadata.annotations["example.com/identity"]
