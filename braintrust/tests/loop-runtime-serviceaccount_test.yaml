suite: test Loop Runtime ServiceAccount template
templates:
  - loop-runtime-serviceaccount.yaml
tests:
  - it: should not render when Loop Runtime is disabled
    values:
      - __fixtures__/base-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should bind the Loop Runtime Google service account
    values: &values
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: braintrust-loop-runtime
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: braintrust-loop@test-project.iam.gserviceaccount.com

  - it: should merge annotations from both configuration paths
    values: *values
    set:
      loopRuntime.annotations.serviceaccount.from-annotations: a
      loopRuntime.serviceAccount.annotations.from-service-account: b
    asserts:
      - equal:
          path: metadata.annotations["from-annotations"]
          value: a
      - equal:
          path: metadata.annotations["from-service-account"]
          value: b
