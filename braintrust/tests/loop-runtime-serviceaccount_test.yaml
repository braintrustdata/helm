suite: test Loop Runtime ServiceAccount template
templates:
  - loop-runtime-serviceaccount.yaml
tests:
  - it: should not render when Loop Runtime is disabled
    values:
      - __fixtures__/base-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should attach the configured AWS role for IRSA
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: braintrust-loop-runtime
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/test-loop-runtime-role

  - it: should support Pod Identity without adding an IRSA annotation
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.serviceAccount.awsRoleArn: ""
    asserts:
      - isNull:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]

  - it: should include ServiceAccount annotations from the nested configuration
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.serviceAccount.annotations.custom-annotation: value
    asserts:
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: value
