# Google Cloud-specific test values
# Extends base-values.yaml with GCP configuration
cloud: "google"

google:
  mode: "autopilot"
  autopilotMachineFamily: "c4"

objectStorage:
  google:
    brainstoreBucket: "test-brainstore-bucket"
    apiBucket: "test-api-bucket"

api:
  extraEnvVars:
    - name: AWS_REGION
      value: "us-central1"

brainstore:
  serviceAccount:
    googleServiceAccount: "test@project.iam.gserviceaccount.com"
