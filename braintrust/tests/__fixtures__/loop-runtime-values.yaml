cloud: "aws"

objectStorage:
  aws:
    brainstoreBucket: "test-brainstore-bucket"
    responseBucket: "test-response-bucket"
    codeBundleBucket: "test-code-bundle-bucket"

loopRuntime:
  enabled: true
  image:
    repository: "test/loop-runtime"
    tag: "v1.0.0"
  serviceAccount:
    name: "braintrust-loop-runtime"
    awsRoleArn: "arn:aws:iam::123456789012:role/test-loop-runtime-role"
  sandbox:
    dnsUrl: "https://nodes.sandbox.internal:9400"
    tls:
      secretName: "sandbox-client-tls"
