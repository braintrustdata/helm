cloud: "aws"

objectStorage:
  aws:
    brainstoreBucket: "test-brainstore-bucket"
    responseBucket: "test-response-bucket"
    codeBundleBucket: "test-code-bundle-bucket"

loopRuntime:
  enabled: true
  image:
    repository: "test/loop-runtime"
    tag: "v1.0.0"
  serviceAccount:
    name: "braintrust-loop-runtime"
    awsRoleArn: "arn:aws:iam::123456789012:role/test-loop-runtime-role"
  sandbox:
    imageIdentifier: "arn:aws:lambda:us-east-1:123456789012:microvm-image/test"
    region: "us-east-1"
    ingressNetworkConnectorArns: "arn:aws:lambda:us-east-1:123456789012:network-connector/in"
    egressNetworkConnectorArns: "arn:aws:lambda:us-east-1:123456789012:network-connector/out"
