suite: test Loop Runtime ConfigMap template
templates:
  - loop-runtime-configmap.yaml
tests:
  - it: should not render when Loop Runtime is disabled
    values:
      - __fixtures__/base-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when reused values have no loopRuntime map
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
      - __fixtures__/pre-loop-runtime-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should explain how to upgrade when reused values enable Loop Runtime without defaults
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
      - __fixtures__/reuse-loop-runtime-enabled-values.yaml
    asserts: &missing-defaults
      - failedTemplate:
          errorMessage: "loopRuntime defaults are missing. Values reused from a chart release that predates Loop Runtime omit them; upgrade with --reset-then-reuse-values."

  - it: should render GKE storage and the Sandbox Service configuration
    values: &values
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.service.port: "4001"
      loopRuntime.sandbox.vcpuCount: "01"
      loopRuntime.sandbox.memoryMib: "02048"
    asserts:
      - equal:
          path: data.BRAINSTORE_INDEX_URI
          value: gs://test-brainstore-bucket/brainstore/index
      - equal:
          path: data.BRAINSTORE_CODE_BUNDLE_URI
          value: gs://test-api-bucket
      - equal:
          path: data.EXO_SANDBOX_SERVICE_DNS_URL
          value: https://workers.sandbox.internal:9400
      - equal:
          path: data.EXO_SANDBOX_VCPU_COUNT
          value: "01"
      - equal:
          path: data.EXO_SANDBOX_MEMORY_MIB
          value: "02048"
      - equal:
          path: data.LOOP_RUNTIME_SANDBOX_SERVICE_EGRESS_GATEWAY_URL
          value: http://loop-egress.sandbox.internal:4002
      - equal:
          path: data.LOOP_RUNTIME_SANDBOX_EGRESS_GATEWAY_URL
          value: http://loop-egress.sandbox.internal:4002
      - equal:
          path: data.LOOP_RUNTIME_REDIS_NAMESPACE
          value: loop-runtime:RELEASE-NAME
      - equal:
          path: data.ORG_NAME
          value: test-org
      - equal:
          path: data.LOOP_RUNTIME_ENABLE_SANDBOX_ADMIN
          value: "false"
      - equal:
          path: data.BRAINSTORE_OBJECT_STORE_CACHE_MEMORY_LIMIT
          value: 256Mi
      - equal:
          path: data.LOOP_RUNTIME_MAX_CLAIMED_CONVERSATIONS
          value: "2"
      - isNull:
          path: data.BRAINSTORE_LOCKS_URI

  - it: should allow sandbox administration only when opted in
    values: *values
    set:
      loopRuntime.enableSandboxAdmin: true
    asserts:
      - equal:
          path: data.LOOP_RUNTIME_ENABLE_SANDBOX_ADMIN
          value: "true"

  - it: should keep sandbox administration disabled for retained null values
    values: *values
    set:
      loopRuntime.enableSandboxAdmin: null
    asserts:
      - equal:
          path: data.LOOP_RUNTIME_ENABLE_SANDBOX_ADMIN
          value: "false"

  - it: should explain reused values without an image pull policy
    values: *values
    set:
      loopRuntime.image.pullPolicy: null
    asserts: *missing-defaults

  - it: should explain reused values without a service type
    values: *values
    set:
      loopRuntime.service.type: null
    asserts: *missing-defaults

  - it: should explain reused values without a service account name
    values: *values
    set:
      loopRuntime.serviceAccount.name: null
    asserts: *missing-defaults

  - it: should explain reused values without resource defaults
    values: *values
    set:
      loopRuntime.resources: null
    asserts: *missing-defaults

  - it: should explain reused values without a service port name
    values: *values
    set:
      loopRuntime.service.portName: null
    asserts: *missing-defaults

  - it: should use the configured egress URL for Git authorization and sandbox traffic
    values: *values
    set:
      loopRuntime.sandbox.egressGateway.url: http://custom-egress.internal:4002
    asserts:
      - equal:
          path: data.LOOP_RUNTIME_SANDBOX_EGRESS_GATEWAY_URL
          value: http://custom-egress.internal:4002
      - equal:
          path: data.LOOP_RUNTIME_SANDBOX_SERVICE_EGRESS_GATEWAY_URL
          value: http://custom-egress.internal:4002

  - it: should serve every org when orgName is empty
    values: *values
    set:
      global.orgName: ""
    asserts:
      - equal:
          path: data.ORG_NAME
          value: "*"

  - it: should use GCS object storage locks when configured
    values: *values
    set:
      brainstore.locksBackend: objectStorage
    asserts:
      - equal:
          path: data.BRAINSTORE_LOCKS_URI
          value: gs://test-brainstore-bucket/brainstore/locks

  - it: should reject Loop Runtime on AWS
    values: *values
    set:
      cloud: aws
    asserts: &not-google
      - failedTemplate:
          errorMessage: "loopRuntime.enabled requires cloud: google. On AWS, Loop Runtime runs on ECS through the Terraform module."

  - it: should reject Loop Runtime on Azure
    values: *values
    set:
      cloud: azure
    asserts: *not-google

  - it: should reject Loop Runtime without a cloud
    values: *values
    set:
      cloud: ""
    asserts: *not-google

  - it: should reject a whitespace-only Google service account
    values: *values
    set:
      loopRuntime.serviceAccount.googleServiceAccount: " \t "
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.serviceAccount.googleServiceAccount is required"

  - it: should reject a zero runtime port
    values: *values
    set:
      loopRuntime.service.port: 0
    asserts: &invalid-port
      - failedTemplate:
          errorMessage: "loopRuntime.service.port must be an integer between 1 and 65535"

  - it: should reject a runtime port above the maximum
    values: *values
    set:
      loopRuntime.service.port: 65536
    asserts: *invalid-port

  - it: should reject a zero sandbox CPU count
    values: *values
    set:
      loopRuntime.sandbox.vcpuCount: 0
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.vcpuCount must be a positive integer"

  - it: should reject a zero sandbox memory size
    values: *values
    set:
      loopRuntime.sandbox.memoryMib: 0
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.memoryMib must be a positive integer"

  - it: should require the worker discovery endpoint
    values: *values
    set:
      loopRuntime.sandbox.dnsUrl: null
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.dnsUrl is required"

  - it: should require the egress address
    values: *values
    set:
      loopRuntime.sandbox.egressGateway.address: ""
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.egressGateway.address is required"

  - it: should explain a missing egress map
    values: *values
    set:
      loopRuntime.sandbox.egressGateway: null
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.egressGateway.address is required"

  - it: should require egress source ranges
    values: *values
    set:
      loopRuntime.sandbox.egressGateway.sourceRanges: []
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.egressGateway.sourceRanges is required"

  - it: should reject a null image tag
    values: *values
    set:
      loopRuntime.image.tag: null
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.image.tag is required"

  - it: should require a sandbox image when enabled
    values: *values
    set:
      loopRuntime.sandbox.image: ""
    asserts: &missing-sandbox-image
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.image is required"

  - it: should reject a padded sandbox image
    values: *values
    set:
      loopRuntime.sandbox.image: " image "
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.image must not have leading or trailing whitespace"

  - it: should ignore missing sandbox configuration when disabled
    values: *values
    set:
      loopRuntime.enabled: false
      loopRuntime.sandbox: null
      loopRuntime.service.port: 0
      loopRuntime.image.pullPolicy: null
      loopRuntime.serviceAccount.googleServiceAccount: " "
    asserts:
      - hasDocuments:
          count: 0

  - it: should require retained null source ranges
    values: *values
    set:
      loopRuntime.sandbox.egressGateway.sourceRanges: null
    asserts:
      - failedTemplate:
          errorMessage: "loopRuntime.sandbox.egressGateway.sourceRanges is required"
