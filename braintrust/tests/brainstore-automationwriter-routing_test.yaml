suite: test automation query endpoint and API startup targets
templates:
  - api-configmap.yaml
  - api-deployment.yaml
  - brainstore-startup-gate-rbac.yaml
tests:
  - it: should preserve writer fallback when the pool is disabled
    template: api-configmap.yaml
    asserts: &fallback
      - isNull:
          path: data.BRAINSTORE_AUTOMATION_WRITER_URL
      - isNotNull:
          path: data.BRAINSTORE_WRITER_URL

  - it: should preserve writer fallback with no pool in reused values
    template: api-configmap.yaml
    values:
      - __fixtures__/pre-automationwriter-values.yaml
    asserts: *fallback

  - it: should preserve writer fallback with null replicas
    template: api-configmap.yaml
    set:
      brainstore.automationwriter.replicas: null
    asserts: *fallback

  - it: should preserve writer fallback with empty replicas
    template: api-configmap.yaml
    set:
      brainstore.automationwriter.replicas: ""
    asserts: *fallback

  - it: should publish the endpoint whenever the pool is enabled
    template: api-configmap.yaml
    release:
      namespace: braintrust
    set: &enabled
      brainstore.automationwriter.replicas: 1
    asserts: &routed
      - equal:
          path: data.BRAINSTORE_AUTOMATION_WRITER_URL
          value: http://brainstore-automationwriter.braintrust:4000

  - it: should publish the endpoint from a partial reused pool
    template: api-configmap.yaml
    release:
      namespace: braintrust
    values:
      - __fixtures__/reuse-automationwriter-replicas-values.yaml
    asserts: *routed

  - it: should resolve null service settings to defaults
    template: api-configmap.yaml
    release:
      namespace: braintrust
    set:
      <<: *enabled
      brainstore.automationwriter.service: null
    asserts: *routed

  - it: should use the custom service port and actual release namespace
    template: api-configmap.yaml
    release:
      namespace: release-namespace
    set:
      <<: *enabled
      global.createNamespace: false
      global.namespace: different-namespace
      brainstore.automationwriter.name: custom-pool
      brainstore.automationwriter.service.name: custom-service
      brainstore.automationwriter.service.port: 4200
    asserts:
      - equal:
          path: data.BRAINSTORE_AUTOMATION_WRITER_URL
          value: http://custom-service.release-namespace:4200

  - it: should use the pool name and created namespace by default
    template: api-configmap.yaml
    set:
      <<: *enabled
      global.createNamespace: true
      global.namespace: created-namespace
      brainstore.automationwriter.name: custom-pool
    asserts:
      - equal:
          path: data.BRAINSTORE_AUTOMATION_WRITER_URL
          value: http://custom-pool.created-namespace:4000


  - it: should preserve gate permissions with a custom automation deployment enabled
    template: brainstore-startup-gate-rbac.yaml
    documentIndex: 0
    set:
      <<: *enabled
      brainstore.automationwriter.name: custom-pool
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: [brainstore-reader, brainstore-writer, brainstore-fastreader, custom-pool]

  - it: should preserve gate permissions with a partial reused pool enabled
    template: brainstore-startup-gate-rbac.yaml
    documentIndex: 0
    values:
      - __fixtures__/reuse-automationwriter-replicas-values.yaml
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: [brainstore-reader, brainstore-writer, brainstore-fastreader, brainstore-automationwriter]


  - it: should track a rendered zero-replica pool until it finishes draining
    template: brainstore-startup-gate-rbac.yaml
    documentIndex: 0
    set:
      brainstore.automationwriter.replicas: ""
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: [brainstore-reader, brainstore-writer, brainstore-fastreader, brainstore-automationwriter]

  - it: should still allow an explicitly disabled startup gate
    template: api-deployment.yaml
    set:
      <<: *enabled
      deploymentOrdering.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.initContainers
