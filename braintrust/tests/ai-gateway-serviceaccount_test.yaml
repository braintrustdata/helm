suite: AI Gateway service account lifecycle
templates:
  - ai-gateway-serviceaccount.yaml
  - ai-gateway-deployment.yaml
  - ai-gateway-configmap.yaml
  - migration-gate.yaml
  - brainstore-startup-gate-rbac.yaml
  - api-configmap.yaml
  - brainstore-reader-deployment.yaml
  - brainstore-reader-configmap.yaml
  - brainstore-writer-deployment.yaml
  - brainstore-writer-configmap.yaml
  - brainstore-fastreader-deployment.yaml
  - brainstore-fastreader-configmap.yaml
  - brainstore-automationwriter-deployment.yaml
  - brainstore-automationwriter-configmap.yaml
tests:
  - it: omits Gateway identity and workload when Gateway is disabled
    set:
      aiGateway.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: ai-gateway-serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: ai-gateway-deployment.yaml

  - it: keeps Gateway identity without granting ordering permissions when ordering is disabled
    release:
      namespace: install-namespace
    set:
      aiGateway.enabled: true
      aiGateway.serviceAccount.name: gateway-identity
      deploymentOrdering.enabled: false
      global.createNamespace: true
      global.namespace: workload-namespace
    asserts:
      - equal:
          path: metadata.name
          value: gateway-identity
        template: ai-gateway-serviceaccount.yaml
      - equal:
          path: metadata.namespace
          value: workload-namespace
        template: ai-gateway-serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: gateway-identity
        template: ai-gateway-deployment.yaml
      - isNull:
          path: spec.template.spec.initContainers
        template: ai-gateway-deployment.yaml
      - hasDocuments:
          count: 0
        template: migration-gate.yaml
      - hasDocuments:
          count: 0
        template: brainstore-startup-gate-rbac.yaml

  - it: grants both ordered waits to the workload identity rather than the namespace default
    release:
      namespace: workload-namespace
    set:
      aiGateway.enabled: true
      aiGateway.serviceAccount.name: gateway-identity
      api.serviceAccount.name: api-identity
      brainstore.serviceAccount.name: brainstore-identity
    asserts:
      - equal:
          path: subjects
          value:
            - {kind: ServiceAccount, name: api-identity, namespace: workload-namespace}
            - {kind: ServiceAccount, name: brainstore-identity, namespace: workload-namespace}
            - {kind: ServiceAccount, name: gateway-identity, namespace: workload-namespace}
        template: migration-gate.yaml
        documentIndex: 2
      - equal:
          path: subjects
          value:
            - {kind: ServiceAccount, name: api-identity, namespace: workload-namespace}
            - {kind: ServiceAccount, name: gateway-identity, namespace: workload-namespace}
        template: brainstore-startup-gate-rbac.yaml
        documentIndex: 1
