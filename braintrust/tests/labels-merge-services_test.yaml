suite: test label merge isolation for services (deepCopy fix)
templates:
  - api-service.yaml
  - brainstore-reader-service.yaml
  - brainstore-writer-service.yaml
  - brainstore-fastreader-service.yaml
  - brainstore-automationwriter-service.yaml
tests:
  # These tests verify the deepCopy fix for services.
  # Without deepCopy, labels would bleed between components due to merge mutation.

  - it: should give API service only global and api-specific labels
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstore.image.tag: v2.17.0
      brainstore.automationwriter.replicas: 1
      brainstore.automationwriter.labels.automationwriter-specific: automationwriter-svc
      global.labels.shared: "global-service"
      global.labels.environment: "production"
      api.labels.component: "api"
      api.labels.api-specific: "api-svc"
      brainstore.reader.labels.component: "reader"
      brainstore.reader.labels.reader-specific: "reader-svc"
      brainstore.writer.labels.component: "writer"
      brainstore.writer.labels.writer-specific: "writer-svc"
      brainstore.fastreader.labels.component: "fastreader"
      brainstore.fastreader.labels.fastreader-specific: "fastreader-svc"
    release:
      namespace: "braintrust"
    template: api-service.yaml
    asserts:
      - isNull:
          path: metadata.labels["automationwriter-specific"]
      - equal:
          path: metadata.labels.shared
          value: global-service
      - equal:
          path: metadata.labels.component
          value: api
      - equal:
          path: metadata.labels["api-specific"]
          value: api-svc
      - isNull:
          path: metadata.labels["reader-specific"]
      - isNull:
          path: metadata.labels["writer-specific"]
      - isNull:
          path: metadata.labels["fastreader-specific"]

  - it: should give Reader service only global and reader-specific labels
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstore.image.tag: v2.17.0
      brainstore.automationwriter.replicas: 1
      brainstore.automationwriter.labels.automationwriter-specific: automationwriter-svc
      global.labels.shared: "global-service"
      api.labels.api-specific: "api-svc"
      brainstore.reader.labels.reader-specific: "reader-svc"
      brainstore.writer.labels.writer-specific: "writer-svc"
      brainstore.fastreader.labels.fastreader-specific: "fastreader-svc"
    release:
      namespace: "braintrust"
    template: brainstore-reader-service.yaml
    asserts:
      - isNull:
          path: metadata.labels["automationwriter-specific"]
      - equal:
          path: metadata.labels.shared
          value: global-service
      - equal:
          path: metadata.labels["reader-specific"]
          value: reader-svc
      - isNull:
          path: metadata.labels["api-specific"]
      - isNull:
          path: metadata.labels["writer-specific"]
      - isNull:
          path: metadata.labels["fastreader-specific"]

  - it: should give Writer service only global and writer-specific labels
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstore.image.tag: v2.17.0
      brainstore.automationwriter.replicas: 1
      brainstore.automationwriter.labels.automationwriter-specific: automationwriter-svc
      global.labels.shared: "global-service"
      api.labels.api-specific: "api-svc"
      brainstore.reader.labels.reader-specific: "reader-svc"
      brainstore.writer.labels.writer-specific: "writer-svc"
      brainstore.fastreader.labels.fastreader-specific: "fastreader-svc"
    release:
      namespace: "braintrust"
    template: brainstore-writer-service.yaml
    asserts:
      - isNull:
          path: metadata.labels["automationwriter-specific"]
      - equal:
          path: metadata.labels.shared
          value: global-service
      - equal:
          path: metadata.labels["writer-specific"]
          value: writer-svc
      - isNull:
          path: metadata.labels["api-specific"]
      - isNull:
          path: metadata.labels["reader-specific"]

  - it: should give Fastreader service only global and fastreader-specific labels
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstore.image.tag: v2.17.0
      brainstore.automationwriter.replicas: 1
      brainstore.automationwriter.labels.automationwriter-specific: automationwriter-svc
      global.labels.shared: "global-service"
      api.labels.api-specific: "api-svc"
      brainstore.reader.labels.reader-specific: "reader-svc"
      brainstore.writer.labels.writer-specific: "writer-svc"
      brainstore.fastreader.labels.fastreader-specific: "fastreader-svc"
    release:
      namespace: "braintrust"
    template: brainstore-fastreader-service.yaml
    asserts:
      - isNull:
          path: metadata.labels["automationwriter-specific"]
      - equal:
          path: metadata.labels.shared
          value: global-service
      - equal:
          path: metadata.labels["fastreader-specific"]
          value: fastreader-svc
      - isNull:
          path: metadata.labels["api-specific"]
      - isNull:
          path: metadata.labels["reader-specific"]
      - isNull:
          path: metadata.labels["writer-specific"]

  - it: should give Automationwriter service only its own and global labels
    set:
      brainstore.automationwriter.replicas: 1
      global.labels.shared: global-service
      api.labels.api-specific: api-svc
      brainstore.reader.labels.reader-specific: reader-svc
      brainstore.writer.labels.writer-specific: writer-svc
      brainstore.fastreader.labels.fastreader-specific: fastreader-svc
      brainstore.automationwriter.labels.automationwriter-specific: automationwriter-svc
    template: brainstore-automationwriter-service.yaml
    asserts:
      - equal:
          path: metadata.labels.shared
          value: global-service
      - equal:
          path: metadata.labels["automationwriter-specific"]
          value: automationwriter-svc
      - isNull:
          path: metadata.labels["api-specific"]
      - isNull:
          path: metadata.labels["reader-specific"]
      - isNull:
          path: metadata.labels["writer-specific"]
      - isNull:
          path: metadata.labels["fastreader-specific"]
