suite: Loop client TLS label isolation
templates:
  - loop-runtime-client-tls.yaml
  - api-deployment.yaml
  - api-configmap.yaml
tests:
  - it: keeps Loop label overrides out of API labels
    values: &managed
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
      - __fixtures__/loop-runtime-client-tls-values.yaml
    set:
      global.labels.team: shared
      loopRuntime.labels.team: loop
    asserts:
      - equal:
          path: metadata.labels.team
          value: loop
        template: loop-runtime-client-tls.yaml
      - equal:
          path: metadata.labels.team
          value: shared
        template: api-deployment.yaml
