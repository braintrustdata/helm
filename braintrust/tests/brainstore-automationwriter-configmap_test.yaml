suite: test Brainstore Automation Writer configmap template
templates:
  - brainstore-automationwriter-configmap.yaml
tests:
  - it: should render Brainstore Automation Writer configmap with default values
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: brainstore-automationwriter
      - equal:
          path: data.BRAINSTORE_READER_ONLY_MODE
          value: "false"
      - equal:
          path: data.BRAINSTORE_PORT
          value: "4000"

  - it: should include the automations writer loop config
    values:
      - __fixtures__/base-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_WRITER_LOOP_CONFIG
          value: "include:automations"

  - it: should omit the configmap when reused values have no automation writer config
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/pre-automationwriter-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - hasDocuments:
          count: 0

  - it: should include configmap annotations when provided
    values:
      - __fixtures__/base-values.yaml
    set:
      brainstore.automationwriter.annotations.configmap:
        custom-annotation: "value"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: value

  - it: should configure AWS URIs including response cache and code bundle
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/aws-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_RESPONSE_CACHE_URI
          value: "s3://test-response-bucket/brainstore-cache"
      - equal:
          path: data.BRAINSTORE_CODE_BUNDLE_URI
          value: "s3://test-code-bundle-bucket"

  - it: should configure Azure URIs including response cache and code bundle
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/azure-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_RESPONSE_CACHE_URI
          value: "az://responses/brainstore-cache"
      - equal:
          path: data.BRAINSTORE_CODE_BUNDLE_URI
          value: "az://code-bundles"

  - it: should configure Google Cloud URIs including response cache and code bundle
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_RESPONSE_CACHE_URI
          value: "gs://test-api-bucket/brainstore-cache"
      - equal:
          path: data.BRAINSTORE_CODE_BUNDLE_URI
          value: "gs://test-api-bucket"

  - it: should not include no-pg vars when skipPgForBrainstoreObjects is not set
    values:
      - __fixtures__/base-values.yaml
    set:
      skipPgForBrainstoreObjects: ""
    release:
      namespace: "braintrust"
    asserts:
      - isNull:
          path: data.BRAINSTORE_ASYNC_SCORING_OBJECTS
      - isNull:
          path: data.BRAINSTORE_LOG_AUTOMATIONS_OBJECTS

  - it: should include no-pg vars when skipPgForBrainstoreObjects is "all"
    values:
      - __fixtures__/base-values.yaml
    set:
      skipPgForBrainstoreObjects: "all"
    release:
      namespace: "braintrust"
    asserts:
      - equal:
          path: data.BRAINSTORE_ASYNC_SCORING_OBJECTS
          value: "all"
      - equal:
          path: data.BRAINSTORE_LOG_AUTOMATIONS_OBJECTS
          value: "all"
