suite: Loop secret reference validation
templates:
  - loop-runtime-configmap.yaml
values:
  - __fixtures__/base-values.yaml
  - __fixtures__/loop-runtime-values.yaml
tests:
  - it: rejects a secret reference containing integer
    set:
      loopRuntime.sandbox.clientTlsSecret: 0
    asserts: &invalid
      - failedTemplate:
          errorMessage: loopRuntime.sandbox.clientTlsSecret must be a Secret Manager version reference or empty

  - it: rejects a secret reference containing boolean
    set:
      loopRuntime.sandbox.clientTlsSecret: false
    asserts: *invalid

  - it: rejects a secret reference containing map
    set:
      loopRuntime.sandbox.clientTlsSecret: {}
    asserts: *invalid

  - it: rejects a secret reference containing list
    set:
      loopRuntime.sandbox.clientTlsSecret: []
    asserts: *invalid

  - it: rejects a secret reference containing URL
    set:
      loopRuntime.sandbox.clientTlsSecret: https://example.com/tls
    asserts: *invalid

  - it: rejects a secret reference containing path traversal
    set:
      loopRuntime.sandbox.clientTlsSecret: projects/p/secrets/s/versions/../other
    asserts: *invalid

  - it: rejects a secret reference containing missing version
    set:
      loopRuntime.sandbox.clientTlsSecret: projects/p/secrets/s
    asserts: *invalid

  - it: rejects a secret reference containing query string
    set:
      loopRuntime.sandbox.clientTlsSecret: projects/p/secrets/s/versions/latest?token=value
    asserts: *invalid
