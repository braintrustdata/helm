suite: test Loop Runtime Service template
templates:
  - loop-runtime-service.yaml
tests:
  - it: should not render when Loop Runtime is disabled
    values:
      - __fixtures__/base-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should expose the minimum runtime port through a ClusterIP service
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.service.port: 1
    asserts:
      - equal:
          path: metadata.name
          value: braintrust-loop-runtime
      - equal:
          path: spec.ports[0].port
          value: 1
      - equal:
          path: spec.type
          value: ClusterIP
