suite: Loop TLS Secret Manager references
templates:
  - loop-runtime-deployment.yaml
  - loop-runtime-configmap.yaml
values:
  - __fixtures__/base-values.yaml
  - __fixtures__/loop-runtime-values.yaml
tests:
  - it: loads native secret credentials into memory without a primary Kubernetes Secret
    template: loop-runtime-deployment.yaml
    set: &native
      deploymentOrdering.enabled: false
      loopRuntime.sandbox.clientTlsSecret: projects/test-project/secrets/loop-client-tls/versions/latest
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: sandbox-tls-init
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: test/loop-runtime:v1.0.0
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [node]
      - equal:
          path: spec.template.spec.initContainers[0].env[1]
          value:
            name: SANDBOX_TLS_SECRET
            value: projects/test-project/secrets/loop-client-tls/versions/latest
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[1]
          pattern: metadata.google.internal
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[1]
          pattern: secretmanager.googleapis.com
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sandbox-tls
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sandbox-tls
            mountPath: /etc/sandbox-tls
            readOnly: true

  - it: retains an external Kubernetes Secret when the reference is missing
    template: loop-runtime-deployment.yaml
    set:
      deploymentOrdering.enabled: false
    asserts: &external
      - notExists:
          path: spec.template.spec.initContainers
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sandbox-tls
            secret:
              secretName: sandbox-client-tls

  - it: retains external TLS with a empty secret reference
    template: loop-runtime-deployment.yaml
    set:
      deploymentOrdering.enabled: false
      loopRuntime.sandbox.clientTlsSecret: ""
    asserts: *external

  - it: retains external TLS with a null secret reference
    template: loop-runtime-deployment.yaml
    set:
      deploymentOrdering.enabled: false
      loopRuntime.sandbox.clientTlsSecret: null
    asserts: *external

  - it: ignores secret loading when Loop is disabled on google
    template: loop-runtime-deployment.yaml
    set:
      cloud: google
      loopRuntime.enabled: false
      loopRuntime.sandbox.clientTlsSecret: projects/test-project/secrets/loop-client-tls/versions/latest
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores secret loading when Loop is disabled on aws
    template: loop-runtime-deployment.yaml
    set:
      cloud: aws
      loopRuntime.enabled: false
      loopRuntime.sandbox.clientTlsSecret: projects/test-project/secrets/loop-client-tls/versions/latest
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores secret loading when Loop is disabled on azure
    template: loop-runtime-deployment.yaml
    set:
      cloud: azure
      loopRuntime.enabled: false
      loopRuntime.sandbox.clientTlsSecret: projects/test-project/secrets/loop-client-tls/versions/latest
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the selected runtime image for credential loading with tag v2.24.0
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.image.tag: "v2.24.0"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: test/loop-runtime:v2.24.0
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:v2.24.0

  - it: uses the selected runtime image for credential loading with tag 2.24.0
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.image.tag: "2.24.0"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: test/loop-runtime:2.24.0
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:2.24.0

  - it: uses the selected runtime image for credential loading with tag abcdef0123456789abcdef0123456789abcdef0123
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.image.tag: "abcdef0123456789abcdef0123456789abcdef0123"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: test/loop-runtime:abcdef0123456789abcdef0123456789abcdef0123
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:abcdef0123456789abcdef0123456789abcdef0123

  - it: uses the selected runtime image for credential loading with tag abc1234
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.image.tag: "abc1234"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: test/loop-runtime:abc1234
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:abc1234

  - it: uses the selected runtime image for credential loading with tag 1234567
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.image.tag: "1234567"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: test/loop-runtime:1234567
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:1234567

  - it: uses the selected runtime image for credential loading with tag v2.24.0-rc.1
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.image.tag: "v2.24.0-rc.1"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: test/loop-runtime:v2.24.0-rc.1
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:v2.24.0-rc.1

  - it: uses the selected runtime image for credential loading with tag custom-build
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.image.tag: "custom-build"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: test/loop-runtime:custom-build
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:custom-build

  - it: preserves null replicas with native TLS loading
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.replicas: null
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: preserves empty replicas with native TLS loading
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.replicas: ""
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: preserves zero replicas with native TLS loading
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.replicas: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: supports a pinned numeric secret version
    template: loop-runtime-deployment.yaml
    set:
      <<: *native
      loopRuntime.sandbox.clientTlsSecret: projects/123456789012/secrets/loop-client-tls/versions/1
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env[1].value
          value: projects/123456789012/secrets/loop-client-tls/versions/1
