suite: test Brainstore API startup gate
templates:
  - api-deployment.yaml
  - api-configmap.yaml
  - brainstore-startup-gate-rbac.yaml
  - api-serviceaccount.yaml
  - brainstore-reader-deployment.yaml
  - brainstore-reader-configmap.yaml
tests:
  - it: should leave API startup unchanged when explicitly disabled
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.initContainers
      - isNull:
          path: spec.template.spec.automountServiceAccountToken

  - it: should not create gate resources when disabled
    template: brainstore-startup-gate-rbac.yaml
    set:
      deploymentOrdering.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should allow an explicit minimum floor and mirrored helper image
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      deploymentOrdering.minimumVersion: v2.15.0
      deploymentOrdering.image: registry.example/python:3.13
      brainstore.image.tag: v2.15.1
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: registry.example/python:3.13
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"
  - it: should mount gate credentials only into the init container
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.tmpVolume.enabled: true
      api.extraContainers:
        - name: metrics-sidecar
          image: registry.example/metrics:v1
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: migration-gate-credentials
            mountPath: /var/run/migration-gate
            readOnly: true
      - contains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: migration-gate-credentials
            mountPath: /var/run/brainstore-gate
            readOnly: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: tmp-volume
              mountPath: /tmp
      - equal:
          path: spec.template.spec.containers[1].volumeMounts
          value:
            - name: tmp-volume
              mountPath: /tmp

  - it: should infer the API floor from a stable tag with a digest
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.image.tag: v2.15.0@sha256:abc
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"

  - it: should gate the ingest pool
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.workloadIsolation.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-brainstore

  - it: should grant only named deployment reads and namespace pod lists
    template: brainstore-startup-gate-rbac.yaml
    set:
      deploymentOrdering.enabled: true
      brainstore.reader.name: custom-reader
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - equal:
          path: rules
          value:
            - apiGroups: [apps]
              resources: [deployments]
              resourceNames: [custom-reader, brainstore-writer, brainstore-fastreader, brainstore-automationwriter]
              verbs: [get]
            - apiGroups: [""]
              resources: [pods]
              verbs: [list]

  - it: should bind every distinct API pool account in the actual namespace
    template: brainstore-startup-gate-rbac.yaml
    release:
      name: gate-test
      namespace: install-namespace
    set:
      deploymentOrdering.enabled: true
      global.createNamespace: true
      global.namespace: workload-namespace
      api.workloadIsolation.enabled: true
      api.workloadIsolation.background.serviceAccount.name: background-account
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.namespace
          value: workload-namespace
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: background-account
              namespace: workload-namespace
            - kind: ServiceAccount
              name: braintrust-api
              namespace: workload-namespace

  - it: should reject opaque API tags when no minimum release can be inferred
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.image.tag: deadbeef
      deploymentOrdering.migrationImage: public.ecr.aws/braintrust/standalone-api:v2.23.0
    asserts:
      - failedTemplate: {}

  - it: should protect an API-only image bump while Brainstore is still old
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.image.tag: v2.15.0
      brainstore.image.tag: v2.14.0
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"

  - it: should derive the release floor independently for overridden API pools
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.workloadIsolation.enabled: true
      api.image.tag: v2.14.0
      api.workloadIsolation.background.image.tag: v2.15.0
    documentIndex: 2
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"

  - it: should pass timing overrides to the checker and extend the progress deadline
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      deploymentOrdering.timeoutSeconds: 1800
      deploymentOrdering.pollIntervalSeconds: 30
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: BRAINSTORE_GATE_TIMEOUT_SECONDS
            value: "1800"
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: BRAINSTORE_GATE_POLL_SECONDS
            value: "30"
      - equal:
          path: spec.progressDeadlineSeconds
          value: 3900

  - it: should reject an API rollout that removes old serving capacity
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.strategy.rollingUpdate.maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "deploymentOrdering requires RollingUpdate with maxUnavailable: 0 for every API pool"

  - it: should reject unsafe strategy overrides in isolated pools
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.workloadIsolation.enabled: true
      api.workloadIsolation.background.strategy.type: Recreate
    asserts:
      - failedTemplate:
          errorMessage: "deploymentOrdering requires RollingUpdate with maxUnavailable: 0 for every API pool"

  - it: should reject a rollout with no room for gated replacement pods
    template: api-deployment.yaml
    set:
      deploymentOrdering.enabled: true
      api.strategy.rollingUpdate.maxSurge: 0
    asserts:
      - failedTemplate:
          errorMessage: deploymentOrdering requires nonzero maxSurge for every API pool

  - it: should preserve service account labels after gate rendering
    template: api-serviceaccount.yaml
    set:
      deploymentOrdering.enabled: true
      global.labels.shared: global
      api.labels.api-only: api
      brainstore.reader.labels.reader-only: reader
    asserts:
      - equal:
          path: metadata.labels.shared
          value: global
      - isNull:
          path: metadata.labels["reader-only"]

  - it: binds optional application identities for direct rollout reads
    template: brainstore-startup-gate-rbac.yaml
    documentIndex: 1
    values:
      - __fixtures__/loop-runtime-values.yaml
    release:
      name: test
      namespace: workload
    set:
      aiGateway.enabled: true
      aiGateway.serviceAccount.name: gateway-account
    asserts:
      - contains:
          path: subjects
          content: {kind: ServiceAccount, name: gateway-account, namespace: workload}
      - contains:
          path: subjects
          content: {kind: ServiceAccount, name: braintrust-loop-runtime, namespace: workload}

  - it: requires an explicit compatibility assertion for opaque Brainstore images
    template: brainstore-reader-deployment.yaml
    set:
      brainstore.image.tag: deadbeef
      deploymentOrdering.migrationImage: public.ecr.aws/braintrust/standalone-api:v2.23.0
    asserts:
      - failedTemplate: {}

  - it: reserves the actual stable Brainstore version against annotation overrides
    template: brainstore-reader-deployment.yaml
    set:
      brainstore.image.tag: v2.22.0@sha256:abc
      brainstore.reader.annotations.pod:
        braintrust.dev/brainstore-version: "9.0.0"
      deploymentOrdering.minimumVersion: "2.21.0"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["braintrust.dev/brainstore-version"]
          value: "2.22.0"

  - it: reserves the explicit compatibility assertion for opaque Brainstore builds
    template: brainstore-reader-deployment.yaml
    set:
      brainstore.image.tag: deadbeef
      deploymentOrdering.minimumVersion: "2.22.0"
      deploymentOrdering.migrationImage: public.ecr.aws/braintrust/standalone-api:release-bundle
      brainstore.reader.annotations.pod:
        braintrust.dev/brainstore-version: "9.0.0"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["braintrust.dev/brainstore-version"]
          value: "2.22.0"
