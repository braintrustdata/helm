suite: test Brainstore API startup gate
templates:
  - api-deployment.yaml
  - api-configmap.yaml
  - brainstore-startup-gate-configmap.yaml
  - brainstore-startup-gate-rbac.yaml
  - api-serviceaccount.yaml
  - brainstore-reader-deployment.yaml
  - brainstore-reader-configmap.yaml
tests:
  - it: should leave API startup unchanged by default
    template: api-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.initContainers
      - isNull:
          path: spec.template.metadata.annotations["checksum/brainstore-startup-gate"]
      - isNull:
          path: spec.template.spec.automountServiceAccountToken

  - it: should not create gate resources when disabled
    template: brainstore-startup-gate-rbac.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create the helper ConfigMap when disabled
    template: brainstore-startup-gate-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should preserve reused values that do not include the new setting
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate: null
    asserts:
      - isNull:
          path: spec.template.spec.initContainers

  - it: should keep the release floor in the API Pod environment
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.image.tag: v2.15.0
      brainstore.image.tag: v2.15.0
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-brainstore
      - equal:
          path: spec.progressDeadlineSeconds
          value: 1500
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_GATE_TIMEOUT_SECONDS
            value: "1200"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_GATE_POLL_SECONDS
            value: "15"
      - equal:
          path: spec.template.spec.initContainers[0].env[0]
          value:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].serviceAccountToken.expirationSeconds
          value: 3600
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/brainstore-startup-gate"]

  - it: should allow an explicit minimum floor and mirrored helper image
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.brainstoreStartupGate.minimumVersion: v2.15.0
      api.brainstoreStartupGate.image: registry.example/python:3.13
      brainstore.image.tag: v2.15.1
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.example/python:3.13
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"

  - it: should mount gate credentials only into the init container
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.tmpVolume.enabled: true
      api.extraContainers:
        - name: metrics-sidecar
          image: registry.example/metrics:v1
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: brainstore-gate-credentials
            mountPath: /var/run/brainstore-gate
            readOnly: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: tmp-volume
              mountPath: /tmp
      - equal:
          path: spec.template.spec.containers[1].volumeMounts
          value:
            - name: tmp-volume
              mountPath: /tmp

  - it: should infer the API floor from a stable tag with a digest
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.image.tag: v2.15.0@sha256:abc
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"

  - it: should gate each API pool even when a pool override tries to disable it
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.workloadIsolation.enabled: true
      api.workloadIsolation.background.brainstoreStartupGate.enabled: false
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: braintrust-api-background
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-brainstore
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should gate the ingest pool
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.workloadIsolation.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-brainstore

  - it: should grant only named deployment reads and namespace pod lists
    template: brainstore-startup-gate-rbac.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      brainstore.reader.name: custom-reader
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - equal:
          path: rules
          value:
            - apiGroups: [apps]
              resources: [deployments]
              resourceNames: [custom-reader, brainstore-writer, brainstore-fastreader]
              verbs: [get]
            - apiGroups: [""]
              resources: [pods]
              verbs: [list]

  - it: should bind every distinct API pool account in the actual namespace
    template: brainstore-startup-gate-rbac.yaml
    release:
      name: gate-test
      namespace: install-namespace
    set:
      api.brainstoreStartupGate.enabled: true
      global.createNamespace: true
      global.namespace: workload-namespace
      api.workloadIsolation.enabled: true
      api.workloadIsolation.background.serviceAccount.name: background-account
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.namespace
          value: workload-namespace
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: background-account
              namespace: workload-namespace
            - kind: ServiceAccount
              name: braintrust-api
              namespace: workload-namespace

  - it: should mount helper code without changing Brainstore startup
    template: brainstore-reader-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.initContainers

  - it: should reject opaque API tags when no minimum release can be inferred
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.image.tag: deadbeef
    asserts:
      - failedTemplate:
          errorMessage: api.brainstoreStartupGate requires a stable API release tag or an explicit stable minimumVersion

  - it: should protect an API-only image bump while Brainstore is still old
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.image.tag: v2.15.0
      brainstore.image.tag: v2.14.0
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"

  - it: should derive the release floor independently for overridden API pools
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.workloadIsolation.enabled: true
      api.image.tag: v2.14.0
      api.workloadIsolation.background.image.tag: v2.15.0
    documentIndex: 2
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_MINIMUM_VERSION
            value: "2.15.0"

  - it: should reject invalid timing
    template: brainstore-startup-gate-rbac.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.brainstoreStartupGate.timeoutSeconds: 0
    asserts:
      - failedTemplate:
          errorMessage: api.brainstoreStartupGate timing values must be positive integers

  - it: should pass timing overrides to the checker and extend the progress deadline
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.brainstoreStartupGate.timeoutSeconds: 1800
      api.brainstoreStartupGate.pollIntervalSeconds: 30
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_GATE_TIMEOUT_SECONDS
            value: "1800"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: BRAINSTORE_GATE_POLL_SECONDS
            value: "30"
      - equal:
          path: spec.progressDeadlineSeconds
          value: 2100

  - it: should reject an insufficient confirmation budget
    template: brainstore-startup-gate-rbac.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.brainstoreStartupGate.timeoutSeconds: 15
    asserts:
      - failedTemplate:
          errorMessage: api.brainstoreStartupGate timeoutSeconds must exceed pollIntervalSeconds for two observations

  - it: should reject an API rollout that removes old serving capacity
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.strategy.rollingUpdate.maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "api.brainstoreStartupGate requires RollingUpdate with maxUnavailable: 0 for every API pool"

  - it: should reject unsafe strategy overrides in isolated pools
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.workloadIsolation.enabled: true
      api.workloadIsolation.background.strategy.type: Recreate
    asserts:
      - failedTemplate:
          errorMessage: "api.brainstoreStartupGate requires RollingUpdate with maxUnavailable: 0 for every API pool"

  - it: should reject a rollout with no room for gated replacement pods
    template: api-deployment.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      api.strategy.rollingUpdate.maxSurge: 0
    asserts:
      - failedTemplate:
          errorMessage: api.brainstoreStartupGate requires nonzero maxSurge for every API pool

  - it: should not leak gate labels into Brainstore or mutate global labels
    template: brainstore-startup-gate-configmap.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      global.labels.shared: global
      api.labels.api-only: api
      brainstore.reader.labels.reader-only: reader
    asserts:
      - equal:
          path: metadata.labels.shared
          value: global
      - equal:
          path: metadata.labels["api-only"]
          value: api
      - isNull:
          path: metadata.labels["reader-only"]

  - it: should preserve service account labels after gate rendering
    template: api-serviceaccount.yaml
    set:
      api.brainstoreStartupGate.enabled: true
      global.labels.shared: global
      api.labels.api-only: api
      brainstore.reader.labels.reader-only: reader
    asserts:
      - equal:
          path: metadata.labels.shared
          value: global
      - isNull:
          path: metadata.labels["reader-only"]
