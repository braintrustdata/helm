suite: test Loop Runtime Deployment template
templates:
  - loop-runtime-deployment.yaml
  - loop-runtime-configmap.yaml
tests:
  - it: should not render when Loop Runtime is disabled
    values:
      - __fixtures__/base-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when reused values have no loopRuntime map
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
      - __fixtures__/pre-loop-runtime-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a hardened runtime pod with GKE workload identity and data-plane secrets
    template: loop-runtime-deployment.yaml
    values: &values
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.serviceAccountName
          value: braintrust-loop-runtime
      - equal:
          path: spec.template.metadata.labels["gke-workload-identity/use"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["iam.gke.io/gcp-service-account"]
          value: braintrust-loop@test-project.iam.gserviceaccount.com
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:v1.0.0
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[0].resources.requests
          value:
            cpu: "1"
            memory: 2Gi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BRAINSTORE_METADATA_URI
            valueFrom:
              secretKeyRef:
                name: braintrust-secrets
                key: PG_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICE_TOKEN_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: braintrust-secrets
                key: FUNCTION_SECRET_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BRAINSTORE_LOCKS_URI
            valueFrom:
              secretKeyRef:
                name: braintrust-secrets
                key: REDIS_URL

  - it: should mount the Sandbox Service client TLS Secret and expose the Git proxy port
    template: loop-runtime-deployment.yaml
    values: *values
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sandbox-service-tls
            mountPath: /etc/sandbox-tls
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sandbox-service-tls
            secret:
              secretName: sandbox-client-tls
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http
              containerPort: 4001
              protocol: TCP
            - containerPort: 4002
              protocol: TCP

  - it: should use a custom TLS Secret name and Git proxy port
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.sandbox.tlsSecretName: custom-tls
      loopRuntime.sandbox.egressGateway.port: 5002
    asserts:
      - equal:
          path: spec.template.spec.volumes[2].secret.secretName
          value: custom-tls
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 5002

  - it: should keep probes on a custom named service port
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.service.port: 5000
      loopRuntime.service.portName: egress
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: egress
            containerPort: 5000
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: egress
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: egress

  - it: should default null replicas to one
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.replicas: null
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should default empty replicas to one
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.replicas: ""
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should scale to zero
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.replicas: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: should keep an explicit replica count
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should default to the pinned image without a semver gate
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.image.repository: public.ecr.aws/braintrust/loop-runtime
      loopRuntime.image.tag: b96d95eaa269031cdd6f286a17b9b3e4795355d1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: public.ecr.aws/braintrust/loop-runtime:b96d95eaa269031cdd6f286a17b9b3e4795355d1
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: should render release tags without the v prefix
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.image.tag: 2.20.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:2.20.0

  - it: should render prerelease tags
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.image.tag: v2.20.0-rc.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:v2.20.0-rc.1

  - it: should render all-digit short SHAs as strings
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.image.tag: "1234567"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:1234567

  - it: should keep a mutable tag with an explicit pull policy
    template: loop-runtime-deployment.yaml
    values: *values
    set:
      loopRuntime.image.tag: latest-2.x
      loopRuntime.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:latest-2.x
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
