suite: test Loop Runtime Deployment template
templates:
  - loop-runtime-deployment.yaml
  - loop-runtime-configmap.yaml
tests:
  - it: should not render when Loop Runtime is disabled
    values:
      - __fixtures__/base-values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a hardened runtime pod with data-plane secrets
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: braintrust-loop-runtime
      - equal:
          path: spec.template.spec.serviceAccountName
          value: braintrust-loop-runtime
      - equal:
          path: spec.template.spec.containers[0].image
          value: test/loop-runtime:v1.0.0
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BRAINSTORE_METADATA_URI
            valueFrom:
              secretKeyRef:
                name: braintrust-secrets
                key: PG_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICE_TOKEN_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: braintrust-secrets
                key: FUNCTION_SECRET_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BRAINSTORE_LOCKS_URI
            valueFrom:
              secretKeyRef:
                name: braintrust-secrets
                key: REDIS_URL
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: state-volume
            mountPath: /mnt/tmp/loop-runtime
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cache-volume
            emptyDir: {}

  - it: should keep probes on a custom named service port
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.service.port: 5000
      loopRuntime.service.portName: metrics
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5000
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: metrics

  - it: should not use GKE workload identity on AWS
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    asserts:
      - isNull:
          path: spec.template.metadata.labels["gke-workload-identity/use"]
      - isNull:
          path: spec.template.metadata.annotations["iam.gke.io/gcp-service-account"]
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1

  - it: should use GKE workload identity and mount Sandbox Service client TLS on Google
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
      - __fixtures__/loop-runtime-google-values.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["gke-workload-identity/use"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["iam.gke.io/gcp-service-account"]
          value: braintrust-loop@test-project.iam.gserviceaccount.com
      - equal:
          path: spec.template.spec.serviceAccountName
          value: braintrust-loop-runtime
      - isNull:
          path: spec.template.spec.nodeSelector
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sandbox-service-tls
            mountPath: /etc/sandbox-tls
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sandbox-service-tls
            secret:
              secretName: sandbox-client-tls
              items:
                - key: client.pem
                  path: client.pem
                - key: client.key
                  path: client.key
                - key: server-ca.pem
                  path: server-ca.pem

  - it: should map custom TLS secret keys to the paths Loop Runtime reads
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
      - __fixtures__/loop-runtime-google-values.yaml
    set:
      loopRuntime.sandbox.sandboxService.tls.secretName: cert-manager-client
      loopRuntime.sandbox.sandboxService.tls.certKey: tls.crt
      loopRuntime.sandbox.sandboxService.tls.keyKey: tls.key
      loopRuntime.sandbox.sandboxService.tls.caKey: ca.crt
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sandbox-service-tls
            secret:
              secretName: cert-manager-client
              items:
                - key: tls.crt
                  path: client.pem
                - key: tls.key
                  path: client.key
                - key: ca.crt
                  path: server-ca.pem

  - it: should omit the TLS volume for a plain HTTP Sandbox Service endpoint
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
      - __fixtures__/loop-runtime-google-values.yaml
    set:
      loopRuntime.sandbox.sandboxService.dnsUrl: http://sandbox-service.sandbox:9400
      loopRuntime.sandbox.sandboxService.tls.secretName: ""
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 2

  - it: should ignore Sandbox Service TLS settings for the MicroVM backend
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/loop-runtime-values.yaml
    set:
      loopRuntime.sandbox.sandboxService.tls.secretName: sandbox-client-tls
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2

  - it: should expose the egress gateway container port when enabled
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
      - __fixtures__/loop-runtime-google-values.yaml
    set:
      loopRuntime.sandbox.egressGateway.enabled: true
      loopRuntime.sandbox.egressGateway.url: http://10.10.0.20:4002
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: egress
            containerPort: 4002
            protocol: TCP

  - it: should not render when reused values have no loopRuntime map
    template: loop-runtime-deployment.yaml
    values:
      - __fixtures__/base-values.yaml
      - __fixtures__/google-values.yaml
      - __fixtures__/pre-loop-runtime-values.yaml
    asserts:
      - hasDocuments:
          count: 0
