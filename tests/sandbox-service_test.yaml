suite: released Sandbox Service chart with EKS Loop Runtime values
templates:
  - configmap.yaml
  - service.yaml
  - worker-statefulset.yaml
  - worker-controller.yaml
  - worker-disruption-budget.yaml
  - worker-admission-policy.yaml
  - check-drained.yaml
tests:
  - it: should advertise the same TLS hostname that the runtime discovers
    release:
      namespace: braintrust-sandbox
      revision: 1
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"endpoint": "https://sandbox-service.braintrust-sandbox.svc.cluster.local:9400"'

  - it: should expose individual worker addresses through a headless Service
    release:
      namespace: braintrust-sandbox
      revision: 1
    template: service.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: braintrust-sandbox
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 9400

  - it: should keep Firecracker workers isolated on dedicated nodes and preserve host state
    release:
      namespace: braintrust-sandbox
      revision: 1
    template: worker-statefulset.yaml
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: OnDelete
      - isNull:
          path: spec.replicas
      - equal:
          path: spec.template.spec.nodeSelector["braintrust.io/workload"]
          value: sandbox-service
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.hostPID
          value: true
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname
      - contains:
          path: spec.template.spec.volumes
          content:
            name: state
            hostPath:
              path: /var/lib/braintrust-sandboxes/1
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: sandbox-tls
              defaultMode: 256

  - it: should reconcile fixed worker capacity without depending on an ECS service
    release:
      namespace: braintrust-sandbox
      revision: 1
    template: worker-controller.yaml
    documentIndex: 6
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [sandbox-service, reconcile-workers]
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --endpoint=https://sandbox-service.braintrust-sandbox.svc.cluster.local:9400
            - --replicas=1
            - --configuration-revision=1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: sandbox-client-tls
              defaultMode: 288

  - it: should request draining rather than directly deleting workers when capacity is zero
    release:
      namespace: braintrust-sandbox
      revision: 1
    template: worker-controller.yaml
    documentIndex: 6
    set:
      replicas: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --replicas=0

  - it: should reconcile a new Helm revision through the worker controller
    template: worker-controller.yaml
    documentIndex: 6
    release:
      revision: 2
      namespace: braintrust-sandbox
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --configuration-revision=2

  - it: should block ordinary eviction of workers holding local sandbox state
    release:
      namespace: braintrust-sandbox
      revision: 1
    template: worker-disruption-budget.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0

  - it: should protect worker deletion in the sandbox namespace
    release:
      namespace: braintrust-sandbox
      revision: 1
    template: worker-admission-policy.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: "request.namespace == 'braintrust-sandbox'"
      - equal:
          path: spec.failurePolicy
          value: Fail

  - it: should refuse uninstall until the worker release has drained
    release:
      namespace: braintrust-sandbox
      revision: 1
    template: check-drained.yaml
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
      - equal:
          path: spec.template.spec.containers[0].command
          value: [sandbox-service, check-workers-drained]
